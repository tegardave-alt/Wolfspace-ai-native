<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Configurable Node — React Flow</title>
    <link rel="stylesheet" href="/vendor/reactflow.css" />
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }
      * {
        box-sizing: border-box;
      }
      body {
        font-family: system-ui, sans-serif;
        background: #0b0e14;
      }
      .cnode {
        width: 250px;
        background: #141b26;
        border: 1px solid #24303f;
        border-left: 3px solid var(--a);
        border-radius: 10px;
        padding: 9px 11px;
        color: #e6edf5;
        font-size: 12px;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
        font-family: ui-monospace, monospace;
      }
      .cnode.sel {
        box-shadow:
          0 0 0 2px var(--a),
          0 6px 20px rgba(0, 0, 0, 0.5);
      }
      .chead {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
      }
      .chead .ic {
        width: 26px;
        height: 26px;
        display: grid;
        place-items: center;
        border-radius: 7px;
        background: color-mix(in srgb, var(--a) 20%, transparent);
        color: var(--a);
        font-size: 14px;
      }
      .cname {
        flex: 1;
        background: transparent;
        border: none;
        color: #e6edf5;
        font-weight: 650;
        font-size: 13px;
        outline: none;
      }
      .sec {
        margin-top: 8px;
      }
      .sec h5 {
        margin: 0 0 5px;
        font-size: 9px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #5b6b7e;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .addbtn {
        cursor: pointer;
        color: var(--a);
        font-size: 11px;
        border: 1px solid color-mix(in srgb, var(--a) 40%, #24303f);
        background: transparent;
        border-radius: 6px;
        padding: 1px 7px;
        font-family: inherit;
      }
      .addbtn:hover {
        background: color-mix(in srgb, var(--a) 14%, transparent);
      }
      .row {
        display: flex;
        gap: 5px;
        align-items: center;
        margin-bottom: 4px;
      }
      .row input {
        min-width: 0;
        background: #0d1117;
        border: 1px solid #2f4056;
        border-radius: 5px;
        color: #dbe4ee;
        font-family: inherit;
        font-size: 11px;
        padding: 3px 6px;
        outline: none;
      }
      .row .k {
        width: 40%;
      }
      .row .v {
        flex: 1;
      }
      .row .rm,
      .port .rm {
        cursor: pointer;
        color: #6b7d90;
        border: none;
        background: transparent;
        font-size: 13px;
        padding: 0 2px;
      }
      .row .rm:hover,
      .port .rm:hover {
        color: #f0776b;
      }
      .port {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 3px;
        font-size: 11px;
        color: #adbac7;
      }
      .port input {
        flex: 1;
        min-width: 0;
        background: #0d1117;
        border: 1px solid #2f4056;
        border-radius: 5px;
        color: #dbe4ee;
        font-family: inherit;
        font-size: 11px;
        padding: 2px 6px;
        outline: none;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex-shrink: 0;
      }
      .panel {
        background: #0e131b;
        border: 1px solid #1f2a37;
        border-radius: 11px;
        padding: 10px 12px;
        color: #e6edf5;
        font-size: 12px;
        max-width: 230px;
      }
      .panel small {
        color: #5b6b7e;
        font-size: 10.5px;
        line-height: 1.5;
        display: block;
        margin-top: 6px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="/vendor/react.production.min.js"></script>
    <script src="/vendor/react-dom.production.min.js"></script>
    <script src="/vendor/reactflow.bundle.js"></script>
    <script src="/vendor/babel.min.js"></script>

    <script type="text/babel" data-presets="react">
      const { useCallback } = React;
      const XY = window.RFLib.XY;
      const {
        ReactFlow,
        ReactFlowProvider,
        Background,
        Controls,
        Panel,
        Handle,
        Position,
        useNodesState,
        useEdgesState,
        addEdge,
        useReactFlow,
        useUpdateNodeInternals,
        MarkerType,
      } = XY;

      // ── NODE CONFIGURABLE: user bebas tambah FIELD, INPUT, OUTPUT di dalam 1 node ──
      function ConfigurableNode({ id, data, selected }) {
        const rf = useReactFlow();
        const updateInternals = useUpdateNodeInternals();
        const a = data.accent || "#4c8bf5";
        const setData = (patch) =>
          rf.setNodes((nds) =>
            nds.map((n) =>
              n.id === id ? { ...n, data: { ...n.data, ...patch } } : n,
            ),
          );
        const fields = data.fields || [];
        const inputs = data.inputs || [];
        const outputs = data.outputs || [];

        const addField = () =>
          setData({ fields: [...fields, { k: "", v: "" }] });
        const setField = (i, key, val) => {
          const f = fields.slice();
          f[i] = { ...f[i], [key]: val };
          setData({ fields: f });
        };
        const rmField = (i) =>
          setData({ fields: fields.filter((_, x) => x !== i) });

        // handle dinamis → WAJIB updateNodeInternals(id) agar posisi colokan & edge dihitung ulang
        const addPort = (side) => {
          const list = side === "inputs" ? inputs : outputs;
          const next = [
            ...list,
            {
              id:
                side.slice(0, -1) +
                "-" +
                Math.random().toString(36).slice(2, 6),
              label: (side === "inputs" ? "in " : "out ") + (list.length + 1),
            },
          ];
          setData({ [side]: next });
          setTimeout(() => updateInternals(id), 0);
        };
        const setPort = (side, i, label) => {
          const list = (side === "inputs" ? inputs : outputs).slice();
          list[i] = { ...list[i], label };
          setData({ [side]: list });
        };
        const rmPort = (side, i) => {
          const list = (side === "inputs" ? inputs : outputs).filter(
            (_, x) => x !== i,
          );
          setData({ [side]: list });
          setTimeout(() => updateInternals(id), 0);
        };

        const stop = (e) => e.stopPropagation();
        const topFor = (i, n) => ((i + 1) / (n + 1)) * 100 + "%";

        return (
          <div
            className={"cnode" + (selected ? " sel" : "")}
            style={{ "--a": a }}
          >
            {/* INPUT handles (kiri) — dinamis */}
            {inputs.map((p, i) => (
              <Handle
                key={p.id}
                id={p.id}
                type="target"
                position={Position.Left}
                style={{
                  top: topFor(i, inputs.length),
                  background: a,
                  width: 9,
                  height: 9,
                  border: "2px solid #0b0e14",
                }}
              />
            ))}
            {/* OUTPUT handles (kanan) — dinamis */}
            {outputs.map((p, i) => (
              <Handle
                key={p.id}
                id={p.id}
                type="source"
                position={Position.Right}
                style={{
                  top: topFor(i, outputs.length),
                  background: a,
                  width: 9,
                  height: 9,
                  border: "2px solid #0b0e14",
                }}
              />
            ))}

            <div className="chead">
              <span className="ic">⚙</span>
              <input
                className="cname nodrag"
                value={data.name || ""}
                onMouseDown={stop}
                onChange={(e) => setData({ name: e.target.value })}
                placeholder="Nama node"
              />
            </div>

            {/* FIELD dinamis (parameter bebas, seperti "Add field" di n8n) */}
            <div className="sec">
              <h5>
                Parameter{" "}
                <button
                  className="addbtn nodrag"
                  onMouseDown={stop}
                  onClick={() => addField()}
                >
                  + field
                </button>
              </h5>
              {fields.length === 0 && (
                <div style={{ color: "#4a5a6d", fontSize: 10.5 }}>
                  belum ada — klik “+ field”.
                </div>
              )}
              {fields.map((f, i) => (
                <div className="row" key={i}>
                  <input
                    className="k nodrag"
                    value={f.k}
                    onMouseDown={stop}
                    onChange={(e) => setField(i, "k", e.target.value)}
                    placeholder="key"
                  />
                  <input
                    className="v nodrag"
                    value={f.v}
                    onMouseDown={stop}
                    onChange={(e) => setField(i, "v", e.target.value)}
                    placeholder="value"
                  />
                  <button
                    className="rm nodrag"
                    onMouseDown={stop}
                    onClick={() => rmField(i)}
                  >
                    ×
                  </button>
                </div>
              ))}
            </div>

            {/* INPUT ports dinamis */}
            <div className="sec">
              <h5>
                Input{" "}
                <button
                  className="addbtn nodrag"
                  onMouseDown={stop}
                  onClick={() => addPort("inputs")}
                >
                  + input
                </button>
              </h5>
              {inputs.map((p, i) => (
                <div className="port" key={p.id}>
                  <span className="dot" style={{ background: a }} />
                  <input
                    className="nodrag"
                    value={p.label}
                    onMouseDown={stop}
                    onChange={(e) => setPort("inputs", i, e.target.value)}
                  />
                  <button
                    className="rm nodrag"
                    onMouseDown={stop}
                    onClick={() => rmPort("inputs", i)}
                  >
                    ×
                  </button>
                </div>
              ))}
            </div>

            {/* OUTPUT ports dinamis */}
            <div className="sec">
              <h5>
                Output{" "}
                <button
                  className="addbtn nodrag"
                  onMouseDown={stop}
                  onClick={() => addPort("outputs")}
                >
                  + output
                </button>
              </h5>
              {outputs.map((p, i) => (
                <div className="port" key={p.id}>
                  <input
                    className="nodrag"
                    value={p.label}
                    onMouseDown={stop}
                    onChange={(e) => setPort("outputs", i, e.target.value)}
                  />
                  <button
                    className="rm nodrag"
                    onMouseDown={stop}
                    onClick={() => rmPort("outputs", i)}
                  >
                    ×
                  </button>
                  <span className="dot" style={{ background: a }} />
                </div>
              ))}
            </div>
          </div>
        );
      }

      const nodeTypes = { conf: ConfigurableNode };

      const initialNodes = [
        {
          id: "1",
          type: "conf",
          position: { x: 60, y: 80 },
          data: {
            name: "My Node",
            accent: "#4c8bf5",
            fields: [
              { k: "url", v: "https://api…" },
              { k: "token", v: "••••" },
            ],
            inputs: [{ id: "in-a", label: "in 1" }],
            outputs: [
              { id: "out-a", label: "success" },
              { id: "out-b", label: "error" },
            ],
          },
        },
        {
          id: "2",
          type: "conf",
          position: { x: 460, y: 60 },
          data: {
            name: "Handler OK",
            accent: "#3fb950",
            fields: [],
            inputs: [{ id: "in-b", label: "in 1" }],
            outputs: [{ id: "out-c", label: "out 1" }],
          },
        },
        {
          id: "3",
          type: "conf",
          position: { x: 460, y: 300 },
          data: {
            name: "Handler Error",
            accent: "#f85149",
            fields: [],
            inputs: [{ id: "in-c", label: "in 1" }],
            outputs: [],
          },
        },
      ];
      const initialEdges = [
        {
          id: "e1",
          source: "1",
          sourceHandle: "out-a",
          target: "2",
          targetHandle: "in-b",
          markerEnd: { type: MarkerType.ArrowClosed },
          animated: true,
        },
        {
          id: "e2",
          source: "1",
          sourceHandle: "out-b",
          target: "3",
          targetHandle: "in-c",
          markerEnd: { type: MarkerType.ArrowClosed },
          style: { stroke: "#f85149" },
        },
      ];

      function Flow() {
        const [nodes, setNodes, onNodesChange] = useNodesState(initialNodes);
        const [edges, setEdges, onEdgesChange] = useEdgesState(initialEdges);
        const rf = useReactFlow();
        const onConnect = useCallback(
          (c) =>
            setEdges((eds) =>
              addEdge(
                {
                  ...c,
                  markerEnd: { type: MarkerType.ArrowClosed },
                  animated: true,
                },
                eds,
              ),
            ),
          [setEdges],
        );
        const addNode = () => {
          const id = "n" + Date.now();
          setNodes((nds) =>
            nds.concat({
              id,
              type: "conf",
              position: {
                x: 120 + Math.random() * 200,
                y: 120 + Math.random() * 200,
              },
              data: {
                name: "New Node",
                accent: "#bc8cff",
                fields: [],
                inputs: [{ id: "i" + id, label: "in 1" }],
                outputs: [{ id: "o" + id, label: "out 1" }],
              },
            }),
          );
        };
        return (
          <ReactFlow
            nodes={nodes}
            edges={edges}
            onNodesChange={onNodesChange}
            onEdgesChange={onEdgesChange}
            onConnect={onConnect}
            nodeTypes={nodeTypes}
            colorMode="dark"
            fitView
            proOptions={{ hideAttribution: false }}
          >
            <Background variant="dots" gap={18} />
            <Controls />
            <Panel position="top-right">
              <div className="panel">
                <strong>Node configurable</strong>
                <div style={{ marginTop: 8 }}>
                  <button
                    className="addbtn"
                    style={{ "--a": "#bc8cff" }}
                    onClick={addNode}
                  >
                    + Node baru
                  </button>
                </div>
                <small>
                  Di DALAM tiap node kamu bebas: tambah/hapus <b>parameter</b>{" "}
                  (+field), tambah/hapus <b>input</b> & <b>output</b>{" "}
                  (colokannya muncul otomatis). Tarik antar-colokan untuk
                  menyambung. Persis konsep n8n — malah lebih bebas.
                </small>
              </div>
            </Panel>
          </ReactFlow>
        );
      }
      ReactDOM.createRoot(document.getElementById("root")).render(
        <ReactFlowProvider>
          <Flow />
        </ReactFlowProvider>,
      );
    </script>
  </body>
</html>
