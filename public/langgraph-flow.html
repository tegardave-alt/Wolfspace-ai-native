<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>React Flow × LangGraph — Web Dev Flow</title>
    <link rel="stylesheet" href="/vendor/reactflow.css" />
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }
      * {
        box-sizing: border-box;
      }
      body {
        font-family: system-ui, sans-serif;
        background: #0b0e14;
        color: #e6edf5;
      }
      .app {
        display: flex;
        height: 100%;
      }
      .palette {
        width: 150px;
        flex-shrink: 0;
        background: #0e131b;
        border-right: 1px solid #1e2733;
        padding: 12px 10px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .palette h4 {
        margin: 0 0 4px;
        font-size: 10px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #5b6b7e;
      }
      .pitem {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 8px 9px;
        border-radius: 8px;
        cursor: grab;
        background: #131a24;
        border: 1px solid #1f2a37;
        border-left: 3px solid var(--a);
        font-size: 12px;
        user-select: none;
      }
      .pitem:hover {
        background: #182231;
      }
      .mid {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      .bar {
        height: 46px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 14px;
        border-bottom: 1px solid #1e2733;
      }
      .bar b {
        font-size: 13px;
      }
      .bar .sub {
        font-size: 11px;
        color: #6b7d90;
      }
      .run {
        margin-left: auto;
        background: #132a1c;
        border: 1px solid #2e6b3f;
        color: #7ee2a8;
        font-weight: 600;
        font-size: 12px;
        padding: 7px 14px;
        border-radius: 8px;
        cursor: pointer;
        font-family: inherit;
      }
      .run:hover {
        background: #16351f;
      }
      .run:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .canvas {
        flex: 1;
        position: relative;
      }
      .splitter {
        width: 6px;
        flex-shrink: 0;
        cursor: col-resize;
        background: #1e2733;
        transition: background 0.1s;
      }
      .splitter:hover,
      .splitter.drag {
        background: #3a5573;
      }
      .right {
        flex-shrink: 0;
        border-left: 1px solid #1e2733;
        display: flex;
        flex-direction: column;
        background: #0c1017;
      }
      .right .rh {
        padding: 9px 12px;
        font-size: 10px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #5b6b7e;
        border-bottom: 1px solid #1e2733;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .preview {
        flex: 1;
        min-height: 0;
        background: #0b0e14;
      }
      .preview iframe {
        width: 100%;
        height: 100%;
        border: 0;
        background: #fff;
      }
      .log {
        height: 170px;
        overflow-y: auto;
        border-top: 1px solid #1e2733;
        padding: 8px 10px;
        font-family: ui-monospace, monospace;
        font-size: 11px;
      }
      .logrow {
        display: flex;
        gap: 8px;
        padding: 3px 0;
        color: #adbac7;
      }
      .logrow .k {
        color: #8fb3ff;
        text-transform: uppercase;
        font-size: 9.5px;
        letter-spacing: 0.1em;
        width: 74px;
        flex-shrink: 0;
      }
      .logrow.err .k {
        color: #f0776b;
      }

      /* node card (gaya header-bar, alur vertikal) */
      .nd {
        position: relative;
        width: 216px;
        background: #131922;
        border: 1px solid #24303f;
        border-top: 2px solid var(--a);
        border-radius: 9px;
        color: #dce4f0;
        font-family: ui-monospace, monospace;
        box-shadow: 0 6px 16px rgba(0, 0, 0, 0.45);
      }
      .nd.act {
        box-shadow:
          0 0 0 2px var(--a),
          0 6px 18px rgba(0, 0, 0, 0.5);
      }
      .nd .hd {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 6px 10px;
        background: color-mix(in srgb, var(--a) 12%, transparent);
        border-bottom: 1px solid color-mix(in srgb, var(--a) 20%, transparent);
        border-radius: 7px 7px 0 0;
      }
      .nd .sq {
        width: 10px;
        height: 10px;
        border-radius: 3px;
        background: var(--a);
        flex-shrink: 0;
      }
      .nd .ti {
        font-size: 10px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--a);
        font-weight: 700;
        flex: 1;
      }
      .nd .bd {
        padding: 8px 10px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .nd input,
      .nd select {
        width: 100%;
        background: #0d1117;
        border: 1px solid #2f4056;
        border-radius: 5px;
        color: #dce4f0;
        font-family: inherit;
        font-size: 11px;
        padding: 3px 6px;
        outline: none;
      }
      .nd .res {
        padding-top: 6px;
        border-top: 1px solid #21324a;
        font-size: 10px;
        color: #8fb3ff;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .react-flow__handle {
        width: 9px;
        height: 9px;
        background: var(--a);
        border: 2px solid #0b0e14;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="/vendor/react.production.min.js"></script>
    <script src="/vendor/react-dom.production.min.js"></script>
    <script src="/vendor/reactflow.bundle.js"></script>
    <script src="/vendor/babel.min.js"></script>

    <script type="text/babel" data-presets="react">
      const { useCallback, useState, useRef } = React;
      const XY = window.RFLib.XY;
      const {
        ReactFlow,
        ReactFlowProvider,
        Background,
        Controls,
        MiniMap,
        Handle,
        Position,
        useNodesState,
        useEdgesState,
        addEdge,
        useReactFlow,
        MarkerType,
      } = XY;

      const META = {
        generate: { t: "Generate Site", a: "#3fb950" },
        http: { t: "HTTP Request", a: "#2f81f7" },
        transform: { t: "Transform", a: "#d29922" },
        condition: { t: "Condition", a: "#bc8cff" },
        output: { t: "Output", a: "#f85149" },
      };
      const arrow = { type: MarkerType.ArrowClosed, width: 16, height: 16 };

      function FlowNode({ id, data }) {
        const rf = useReactFlow();
        const kind = data.kind;
        const m = META[kind] || META.output;
        const set = (patch) =>
          rf.setNodes((nds) =>
            nds.map((n) =>
              n.id === id ? { ...n, data: { ...n.data, ...patch } } : n,
            ),
          );
        const stop = (e) => e.stopPropagation();
        let body = null;
        if (kind === "generate")
          body = (
            <>
              <input
                className="nodrag"
                value={data.title || ""}
                onMouseDown={stop}
                onChange={(e) => set({ title: e.target.value })}
                placeholder="Judul situs"
              />
              <input
                className="nodrag"
                value={data.tagline || ""}
                onMouseDown={stop}
                onChange={(e) => set({ tagline: e.target.value })}
                placeholder="Tagline"
              />
              <input
                className="nodrag"
                value={data.color || ""}
                onMouseDown={stop}
                onChange={(e) => set({ color: e.target.value })}
                placeholder="#4c8bf5"
              />
            </>
          );
        else if (kind === "http")
          body = (
            <div style={{ display: "flex", gap: 5 }}>
              <select
                className="nodrag"
                style={{ width: 70, color: "#8fb3ff", fontWeight: 600 }}
                value={data.method || "GET"}
                onMouseDown={stop}
                onChange={(e) => set({ method: e.target.value })}
              >
                {["GET", "POST"].map((x) => (
                  <option key={x}>{x}</option>
                ))}
              </select>
              <input
                className="nodrag"
                value={data.url || ""}
                onMouseDown={stop}
                onChange={(e) => set({ url: e.target.value })}
                placeholder="https://api…"
              />
            </div>
          );
        else if (kind === "transform")
          body = (
            <input
              className="nodrag"
              value={data.expr || ""}
              onMouseDown={stop}
              onChange={(e) => set({ expr: e.target.value })}
              placeholder="path JSON, mis. 0.name"
            />
          );
        else if (kind === "condition")
          body = (
            <input
              className="nodrag"
              value={data.check || ""}
              onMouseDown={stop}
              onChange={(e) => set({ check: e.target.value })}
              placeholder="kata kunci, mis. site"
            />
          );
        else if (kind === "output")
          body = (
            <div style={{ fontSize: 10, color: "#6b7d90" }}>
              hasil akhir flow
            </div>
          );
        return (
          <div
            className={"nd" + (data.active ? " act" : "")}
            style={{ "--a": m.a }}
          >
            {kind !== "generate" && (
              <Handle type="target" position={Position.Top} />
            )}
            <div className="hd">
              <span className="sq" />
              <span className="ti">{m.t}</span>
              {data.ok === false && <span style={{ color: "#f0776b" }}>✕</span>}
            </div>
            <div className="bd">
              {body}
              {data.result && (
                <div className="res" title={data.result}>
                  📄 {data.result}
                </div>
              )}
            </div>
            {kind === "condition" ? (
              <div style={{ position: "relative", height: 13 }}>
                <Handle
                  id="true"
                  type="source"
                  position={Position.Bottom}
                  style={{ left: "30%", background: "#3fb950" }}
                />
                <Handle
                  id="false"
                  type="source"
                  position={Position.Bottom}
                  style={{ left: "70%", background: "#f85149" }}
                />
                <span
                  style={{
                    position: "absolute",
                    left: "30%",
                    top: 1,
                    transform: "translateX(-50%)",
                    fontSize: 8.5,
                    color: "#3fb950",
                  }}
                >
                  true
                </span>
                <span
                  style={{
                    position: "absolute",
                    left: "70%",
                    top: 1,
                    transform: "translateX(-50%)",
                    fontSize: 8.5,
                    color: "#f85149",
                  }}
                >
                  false
                </span>
              </div>
            ) : (
              kind !== "output" && (
                <Handle type="source" position={Position.Bottom} />
              )
            )}
          </div>
        );
      }
      // CATATAN: "output" (juga input/default/group) adalah tipe RESERVED React Flow —
      // memakainya membuat CSS default .react-flow__node-output menggambar kotak ekstra
      // di sekeliling kartu custom. Jadi tipe RF untuk output pakai nama lain ("outputNode").
      const rfType = (kind) => (kind === "output" ? "outputNode" : kind);
      const nodeTypes = {
        generate: FlowNode,
        http: FlowNode,
        transform: FlowNode,
        condition: FlowNode,
        outputNode: FlowNode,
      };
      const PALETTE = ["generate", "http", "transform", "condition", "output"];

      const initialNodes = [
        {
          id: "n1",
          type: "generate",
          position: { x: 170, y: 20 },
          data: {
            kind: "generate",
            title: "My Landing",
            tagline: "Web dev flow via LangGraph",
            color: "#4c8bf5",
          },
        },
        {
          id: "n2",
          type: "condition",
          position: { x: 190, y: 250 },
          data: { kind: "condition", check: "site" },
        },
        {
          id: "n3",
          type: "outputNode",
          position: { x: 40, y: 440 },
          data: { kind: "output", note: "deploy" },
        },
        {
          id: "n4",
          type: "http",
          position: { x: 330, y: 440 },
          data: {
            kind: "http",
            method: "GET",
            url: "https://api.github.com/zen",
          },
        },
      ];
      const initialEdges = [
        { id: "e12", source: "n1", target: "n2", markerEnd: arrow },
        {
          id: "e23t",
          source: "n2",
          sourceHandle: "true",
          target: "n3",
          markerEnd: arrow,
          label: "true",
          style: { stroke: "#3fb950" },
        },
        {
          id: "e24f",
          source: "n2",
          sourceHandle: "false",
          target: "n4",
          markerEnd: arrow,
          label: "false",
          style: { stroke: "#f85149" },
        },
      ];

      function App() {
        const [nodes, setNodes, onNodesChange] = useNodesState(initialNodes);
        const [edges, setEdges, onEdgesChange] = useEdgesState(initialEdges);
        const [running, setRunning] = useState(false);
        const [log, setLog] = useState([]);
        const [site, setSite] = useState(""); // penanda "ada isi"
        const [siteUrl, setSiteUrl] = useState(""); // blob URL utk iframe (punya base URL sendiri)
        const urlRef = useRef("");
        // Tampilkan situs via BLOB URL, bukan srcDoc. srcDoc mewarisi base URL induk →
        // link href="#" di situs malah resolve ke halaman app (127.0.0.1:8092) sehingga
        // iframe memuat ULANG seluruh app → tampak "duplikat". Blob URL punya base sendiri,
        // jadi "#" tetap di dalam situs.
        const showSite = (html) => {
          setSite(html || "");
          if (urlRef.current) URL.revokeObjectURL(urlRef.current);
          urlRef.current = html
            ? URL.createObjectURL(new Blob([html], { type: "text/html" }))
            : "";
          setSiteUrl(urlRef.current);
        };
        const [rightW, setRightW] = useState(360); // lebar panel kanan (draggable)
        const [dragging, setDragging] = useState(false);
        const idRef = useRef(10);
        const rf = useReactFlow();

        // Seret pembatas → ubah lebar panel kanan (otomatis me-resize area kanvas kiri).
        const startDrag = useCallback((e) => {
          e.preventDefault();
          setDragging(true);
          const move = (ev) =>
            setRightW(
              Math.max(
                260,
                Math.min(
                  window.innerWidth - 260,
                  window.innerWidth - ev.clientX,
                ),
              ),
            );
          const up = () => {
            setDragging(false);
            document.removeEventListener("mousemove", move);
            document.removeEventListener("mouseup", up);
          };
          document.addEventListener("mousemove", move);
          document.addEventListener("mouseup", up);
        }, []);
        const onConnect = useCallback(
          (c) => setEdges((eds) => addEdge({ ...c, markerEnd: arrow }, eds)),
          [setEdges],
        );
        const onDragOver = useCallback((e) => {
          e.preventDefault();
          e.dataTransfer.dropEffect = "move";
        }, []);
        const onDrop = useCallback(
          (e) => {
            e.preventDefault();
            const k = e.dataTransfer.getData("k");
            if (!k) return;
            const pos = rf.screenToFlowPosition({ x: e.clientX, y: e.clientY });
            const d = { kind: k };
            if (k === "generate")
              Object.assign(d, {
                title: "Page",
                tagline: "...",
                color: "#4c8bf5",
              });
            if (k === "http") Object.assign(d, { method: "GET", url: "" });
            if (k === "condition") d.check = "";
            setNodes((nds) =>
              nds.concat({
                id: "n" + idRef.current++,
                type: rfType(k),
                position: pos,
                data: d,
              }),
            );
          },
          [rf, setNodes],
        );
        const setActive = (id, on) =>
          setNodes((nds) =>
            nds.map((n) =>
              n.id === id ? { ...n, data: { ...n.data, active: on } } : n,
            ),
          );
        const setNodeRes = (id, ok, result) =>
          setNodes((nds) =>
            nds.map((n) =>
              n.id === id ? { ...n, data: { ...n.data, ok, result } } : n,
            ),
          );

        const run = async () => {
          setRunning(true);
          setLog([]);
          showSite("");
          setNodes((nds) =>
            nds.map((n) => ({
              ...n,
              data: {
                ...n.data,
                active: false,
                ok: undefined,
                result: undefined,
              },
            })),
          );
          const spec = {
            nodes: rf
              .getNodes()
              .map((n) => ({ id: n.id, type: n.type, data: n.data })),
            edges: rf
              .getEdges()
              .map((e) => ({
                source: e.source,
                target: e.target,
                sourceHandle: e.sourceHandle,
                label: e.label,
              })),
          };
          try {
            const res = await fetch("/run", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(spec),
            });
            const reader = res.body.getReader();
            const dec = new TextDecoder();
            let buf = "";
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              buf += dec.decode(value, { stream: true });
              const parts = buf.split("\n\n");
              buf = parts.pop();
              for (const p of parts) {
                const mm = p.match(/^data:\s*(.*)$/s);
                if (!mm) continue;
                let j;
                try {
                  j = JSON.parse(mm[1]);
                } catch (_) {
                  continue;
                }
                if (j.t === "node") {
                  setActive(j.id, true);
                  setTimeout(() => setActive(j.id, false), 700);
                  if (j.entry) {
                    setNodeRes(j.id, j.entry.ok, j.entry.summary);
                    setLog((L) =>
                      L.concat({
                        k: j.entry.kind,
                        ok: j.entry.ok,
                        m: j.entry.summary,
                      }),
                    );
                  }
                } else if (j.t === "done") {
                  if (j.site) showSite(j.site);
                  setLog((L) =>
                    L.concat({
                      k: "done",
                      ok: true,
                      m: "flow selesai (StateGraph LangGraph)",
                    }),
                  );
                } else if (j.t === "err") {
                  if (j.site) showSite(j.site);
                  setLog((L) => L.concat({ k: "error", ok: false, m: j.m }));
                }
              }
            }
          } catch (e) {
            setLog((L) => L.concat({ k: "error", ok: false, m: e.message }));
          }
          setNodes((nds) =>
            nds.map((n) => ({ ...n, data: { ...n.data, active: false } })),
          );
          setRunning(false);
        };

        return (
          <div className="app">
            <div className="palette">
              <h4>Node</h4>
              {PALETTE.map((k) => (
                <div
                  key={k}
                  className="pitem"
                  style={{ "--a": META[k].a }}
                  draggable
                  onDragStart={(e) => {
                    e.dataTransfer.setData("k", k);
                    e.dataTransfer.effectAllowed = "move";
                  }}
                >
                  {META[k].t}
                </div>
              ))}
            </div>

            <div className="mid">
              <div className="bar">
                <button className="run" onClick={run} disabled={running}>
                  {running ? "⏳ Menjalankan…" : "▶ Run on LangGraph"}
                </button>
              </div>
              <div className="canvas" onDrop={onDrop} onDragOver={onDragOver}>
                <ReactFlow
                  nodes={nodes}
                  edges={edges}
                  onNodesChange={onNodesChange}
                  onEdgesChange={onEdgesChange}
                  onConnect={onConnect}
                  nodeTypes={nodeTypes}
                  colorMode="dark"
                  fitView
                  proOptions={{ hideAttribution: true }}
                >
                  <Background variant="dots" gap={18} />
                  <Controls />
                </ReactFlow>
              </div>
            </div>

            <div
              className={"splitter" + (dragging ? " drag" : "")}
              onMouseDown={startDrag}
              title="Seret untuk mengubah ukuran"
            />

            <div className="right" style={{ width: rightW + "px" }}>
              <div className="rh">
                <span>Preview website (hasil node Generate)</span>
              </div>
              <div className="preview">
                {siteUrl ? (
                  <iframe
                    src={siteUrl}
                    title="preview"
                    style={{ pointerEvents: dragging ? "none" : "auto" }}
                  />
                ) : (
                  <div style={{ padding: 20, color: "#4a5a6d", fontSize: 12 }}>
                    Belum ada — klik <b>Run on LangGraph</b>. Node “Generate
                    Site” akan menghasilkan website di sini.
                  </div>
                )}
              </div>
            </div>
          </div>
        );
      }
      ReactDOM.createRoot(document.getElementById("root")).render(
        <ReactFlowProvider>
          <App />
        </ReactFlowProvider>,
      );
    </script>
  </body>
</html>
