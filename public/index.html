    <!-- Content-Security-Policy: silences Electron's security warning WITHOUT
         'unsafe-eval'. 'unsafe-inline' is REQUIRED — the app injects
         Babel-compiled code as an inline <script>, and there are inline styles.
         blob: and worker-src are for Monaco's workers. connect and frame are
         loose for the fetch API and the Live Browser preview. If some library
         turns out to need eval, delete this meta tag: the warning returns, but
         nothing breaks. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' app: blob: data:; script-src 'self' 'unsafe-inline' app: blob:; style-src 'self' 'unsafe-inline' app:; img-src 'self' data: blob: app: http: https:; font-src 'self' data: app:; media-src 'self' data: blob: app:; connect-src 'self' app: blob: data: http: https: ws: wss:; worker-src 'self' blob: app:; child-src 'self' blob: app:; frame-src 'self' app: blob: data: http: https:;"

    <script>
      // Polyfill process.env for browser (required by some libraries like LangChain/OpenAI if loaded)
      window.process = { env: { NODE_ENV: "development" } };

      // Intercept API keys and configuration safely at boot
      window._env_config = {};
      (function () {
        try {
          var params = new URLSearchParams(window.location.search);
          var qStr = params.get("q");
          if (qStr) {
            window._env_config = JSON.parse(decodeURIComponent(qStr));
            // Clean up the URL so keys aren't sitting in the address bar
            window.history.replaceState(
              {},
              document.title,
              window.location.pathname,
            );
          } else {
            var ls = localStorage.getItem("wolfspace_config");
            if (ls) window._env_config = JSON.parse(ls);
          }
        } catch (e) {
          console.error("Failed to parse config string", e);
        }

        // Auto save on change
        window.saveConfig = function (cfg) {
          window._env_config = cfg;
          localStorage.setItem("wolfspace_config", JSON.stringify(cfg));
        };
      })();

      // INHERITED CREDENTIALS ARE DROPPED EVERY TIME, unconditionally.
      //
      // The rebrand block below is guarded by a wolfspace_key_migrated marker,
      // and that marker IS ITSELF COPIED when an old profile is migrated — so
      // the block returns early and quantum_cloud stays in localStorage with
      // the API key inside it. Measured on a genuinely empty profile: the model
      // picker was clean, and the key was still there.
      //
      // A key inherited from another profile is not a key anyone chose for this
      // installation, so it never had a reason to survive. This check is cheap
      // and runs on every start.
      (function () {
        try {
          for (var i = localStorage.length - 1; i >= 0; i--) {
            var k = localStorage.key(i);
            if (k && k.indexOf("quantum_") === 0 && /_cloud$/.test(k)) {
              localStorage.removeItem(k);
            }
          }
        } catch (e) {}
      })();

      // Rebrand: rename the quantum_* localStorage keys to wolfspace_* ONCE,
      // CARRYING the data across so chats, config and the project list are not
      // lost. It runs before the app loads, so code that already uses
      // wolfspace_* finds its data immediately.
      (function () {
        try {
          if (localStorage.getItem("wolfspace_key_migrated")) return;
          for (var i = localStorage.length - 1; i >= 0; i--) {
            var k = localStorage.key(i);
            if (k && k.indexOf("quantum_") === 0) {
              // CREDENTIALS ARE NOT CARRIED ACROSS. A *_cloud entry holds API
              // keys, and a key inherited from an old profile is not one anyone
              // chose for THIS installation.
              //
              // Measured on a genuinely empty profile: the installed app
              // produced a quantum_cloud entry containing a real sk- key, this
              // block renamed it to wolfspace_cloud, and the model picker
              // opened showing a model with the last four digits of a key
              // beside it — as though the user had configured it. They never
              // had.
              //
              // Dropped whole rather than filtered: without the key, the
              // provider and model inside it mean nothing.
              if (k === "quantum_cloud" || /_cloud$/.test(k)) {
                localStorage.removeItem(k);
                continue;
              }
              var nk = "wolfspace_" + k.slice("quantum_".length);
              if (localStorage.getItem(nk) === null)
                localStorage.setItem(nk, localStorage.getItem(k));
              localStorage.removeItem(k);
            }
          }
          localStorage.setItem("wolfspace_key_migrated", "1");
        } catch (e) {}
      })();
    </script>

    <!-- ── Vendor cost meter ──────────────────────────────────────────────
         Every <script src> below is RENDER-BLOCKING: no defer, no async, no
         type=module. So the browser fetches, compiles AND executes each one in
         order before a single pixel is painted, and 8.5 MB of that runs on
         every start regardless of whether the session ever opens a diagram or
         a 3D file.

         Guessing which of them is expensive is not possible from the file
         sizes: a first attempt to measure them with vm.Script in Node reported
         0 ms for all of them, because V8 defers compilation until a function
         is first called. What actually costs is TOP-LEVEL EXECUTION — mermaid
         registering its diagram parsers, three building its class hierarchy —
         and that only happens in a real browser.

         So it is measured here, in the place where it actually happens. An
         inline <script> runs immediately after the external script above it
         finishes executing, so each delta below IS that script's full cost.

         Reported through console.log because electron/main.ts already forwards
         renderer console messages to the main log (see the console-message
         handler there). No IPC, no preload bridge, no contract to keep in sync.
         Ten performance.now() calls cost nothing worth measuring. -->
    <script>
      window.__vt = (function () {
        var titik = [];
        var last = performance.now();
        var awal = last;
        return function (nama) {
          var n = performance.now();
          titik.push([nama, n - last]);
          last = n;
          if (nama !== "__selesai") return;
          try {
            var berat = titik
              .filter(function (x) {
                return x[1] >= 1;
              })
              .sort(function (a, b) {
                return b[1] - a[1];
              })
              .map(function (x) {
                return x[0] + " " + Math.round(x[1]) + "ms";
              });
            console.log(
              "[probe] VENDOR " +
                Math.round(n - awal) +
                "ms total — " +
                (berat.length ? berat.join(", ") : "semua di bawah 1ms"),
            );
          } catch (e) {}
        };
      })();
      __vt("__mulai");

      // ── ON-DEMAND VENDOR LOADING ──
      //
      // Measured in the running app, not estimated:
      //
      //   VENDOR 11795ms total — mermaid 8904, three3d 1266, xterm 705,
      //   babel 580, react 238, monaco-loader 74, cytoscape 28
      //
      // Eleven point eight seconds of blocked rendering before one pixel is
      // drawn — more than twice the 5000 ms threshold at which Windows marks a
      // window unresponsive. Mermaid alone is 75% of it.
      //
      // The three biggest are not needed at startup: mermaid only when a chat
      // contains a diagram, three3d only when a 3D preview is opened, and babel
      // only when the agent edits its own UI source (the normal path uses the
      // prebuilt app.build.js). All three now load on first use.
      //
      // The cost MOVES, it is not hidden: every lazy load prints its own line,
      // so the pause when a feature is first opened stays measurable instead of
      // becoming a mystery.
      window.__muatVendor = (function () {
        var tertunda = {};
        return function (nama, src, sesudah) {
          if (tertunda[nama]) return tertunda[nama];
          var t0 = performance.now();
          tertunda[nama] = new Promise(function (ok, gagal) {
            var s = document.createElement("script");
            s.src = src;
            s.onload = function () {
              try {
                if (sesudah) sesudah();
              } catch (e) {}
              try {
                console.log(
                  "[probe] VENDOR-LAZY " +
                    nama +
                    " " +
                    Math.round(performance.now() - t0) +
                    "ms",
                );
              } catch (e) {}
              ok();
            };
            s.onerror = function () {
              // Rejected, not left hanging: the caller has a fallback path
              // (MermaidBlock drops to its own SVG parser), and a promise that
              // never settles would freeze that path for good.
              tertunda[nama] = null;
              gagal(new Error("failed to load " + nama));
            };
            document.head.appendChild(s);
          });
          return tertunda[nama];
        };
      })();

      window.__muatMermaid = function () {
        return window.__muatVendor(
          "mermaid",
          "/vendor/mermaid.min.js",
          function () {
            // IIFE esbuild menaruh API-nya di global internal; normalkan —
            // dulu dilakukan tag <script> inline tepat setelah muat.
            var _m =
              window.__esbuild_esm_mermaid_nm &&
              window.__esbuild_esm_mermaid_nm.mermaid;
            if (_m) window.mermaid = _m.default || _m;
          },
        );
      };
      window.__muatThree = function () {
        return window.__muatVendor("three3d", "/vendor/three3d.bundle.js");
      };
      window.__muatBabel = function () {
        // Monaco loads an AMD loader, so `define.amd` EXISTS. The vendored
        // Babel bundle is UMD and tests for AMD BEFORE the global branch, so it
        // registers as an anonymous module nobody ever requires: the script
        // loads, onload fires, and `Babel` never exists.
        //
        // The symptom is misleading — a clean "VENDOR-LAZY babel 52ms",
        // followed by "ReferenceError: Babel is not defined". Measured in a real
        // window: with `define` hidden, window.Babel = 7.29.0; with `define`
        // visible, undefined.
        var d = window.define;
        var pulihkan = function () {
          if (d) window.define = d;
        };
        if (d) window.define = undefined;
        // Restored along BOTH paths: `sesudah` runs only on success, and a
        // failed load must not leave Monaco's loader hidden for the rest of the
        // session.
        return window
          .__muatVendor("babel", "/vendor/babel.min.js", pulihkan)
          .catch(function (e) {
            pulihkan();
            throw e;
          });
      };
    </script>

    <script>
      var MB = location.origin;
      // ── HOW THE WORKER IS BOOTSTRAPPED, AND WHY IT CHANGED ──
      //
      // This used to importScripts vs/base/worker/workerMain.js. That file
      // DOES NOT EXIST from Monaco 0.53 onwards — its own changelog says
      // "Custom AMD workers don't work anymore out of the box" — and the
      // failure is the quiet kind: the editor still loads, still highlights,
      // still creates models, and only the worker-backed half goes missing.
      // Hover, go-to-definition and find-references simply stop answering.
      //
      // MEASURED against 0.56.0 in a real browser, same page both ways:
      //   workerMain.js path   -> editor created, getTypeScriptWorker REJECTS
      //   the two lines below  -> editor created, worker answers quickInfo
      //
      // The worker loads the AMD loader itself and then asks for the module
      // Monaco now publishes for this, vs/editor/editor.worker.
      window.MonacoEnvironment = {
        getWorkerUrl: function () {
          return URL.createObjectURL(
            new Blob(
              [
                "self.MonacoEnvironment={baseUrl:'" +
                  MB +
                  "/vendor/monaco/'};" +
                  "importScripts('" +
                  MB +
                  "/vendor/monaco/vs/loader.js');" +
                  "require.config({paths:{vs:'" +
                  MB +
                  "/vendor/monaco/vs'}});" +
                  "require(['vs/editor/editor.worker'], function(){});",
              ],
              { type: "text/javascript" },
            ),
          );
        },
      };
      require.config({ paths: { vs: MB + "/vendor/monaco/vs" } });
      window.monacoReady = new Promise(function (res) {
        require(["vs/editor/editor.main"], function () {
          // ── Worker TypeScript-nya DINYALAKAN ──
          //
          // Ia sudah ikut di-vendor sejak awal (vs/language/typescript) dan tak
          // pernah disetel sekali pun, jadi hover, go-to-definition dan
          // find-references tak punya apa pun untuk diselesaikan. Model kini
          // membawa URI berkas sungguhan (lihat createModel di app.tsx); opsi
          // di bawah ini separuh sisanya — tanpa resolusi modul dan setelan jsx,
          // sebuah import tetap tak menuju ke mana-mana.
          var ts = window.monaco.languages.typescript;
          var opsiTs = {
            target: ts.ScriptTarget.ES2020,
            module: ts.ModuleKind.ESNext,
            moduleResolution: ts.ModuleResolutionKind.NodeJs,
            allowJs: true,
            checkJs: false,
            jsx: ts.JsxEmit.React,
            allowNonTsExtensions: true,
            esModuleInterop: true,
            skipLibCheck: true,
          };
          ts.typescriptDefaults.setCompilerOptions(opsiTs);
          ts.javascriptDefaults.setCompilerOptions(opsiTs);
          // Validasi SEMANTIK sengaja dimatikan.
          //
          // Worker ini hanya tahu berkas yang modelnya terbuka, jadi ia akan
          // menggarisbawahi import yang sah sebagai "tak ditemukan" semata
          // karena berkas tujuannya belum pernah dibuka. Panel INFO sudah
          // menjalankan tsc atas SELURUH workspace dan tahu semuanya — dua
          // sumber kebenaran, dan yang di sini lebih sering keliru.
          //
          // Validasi SINTAKS tetap menyala: itu hanya butuh berkas di depan
          // mata, dan di situ ia selalu benar.
          var diagTs = {
            noSemanticValidation: true,
            noSyntaxValidation: false,
          };
          ts.typescriptDefaults.setDiagnosticsOptions(diagTs);
          ts.javascriptDefaults.setDiagnosticsOptions(diagTs);

          // ── Python: hover, definisi, referensi ──
          //
          // Monaco hanya mengirim language service sungguhan untuk EMPAT bahasa
          // (typescript, css, html, json). Sisanya di basic-languages -- 91
          // bahasa terdaftar pada 0.56.0, dihitung lewat
          // monaco.languages.getLanguages() di peramban sungguhan -- hanya dapat
          // pewarnaan. Jadi intelijensi Python datang dari
          // LUAR Monaco: worker Jedi yang selama ini sudah berjalan untuk
          // autocomplete, ditanyai tiga pertanyaan lagi lewat /pyintel.
          //
          // Posisi diterjemahkan di perbatasan. Monaco menghitung kolom dari 1,
          // Jedi dari 0 — salah di sini berarti meleset satu karakter di SETIAP
          // pencarian, dan gejalanya terlihat seperti "kadang benar kadang
          // tidak" alih-alih seperti bug.
          function pyMinta(op, model, position) {
            // A REAL PYTHON SERVER WINS. When pyright (or pylsp) is installed,
            // core/lsp-session.ts serves Python and installLsp() records that
            // here. Without this check BOTH answer: Monaco merges hover results
            // from every provider, so the user would get the same symbol
            // described twice, once by Jedi and once by a language server that
            // knows strictly more.
            //
            // Checked at CALL time, not at registration: a server installed
            // while the app is open starts serving without a restart.
            if (window.__lspAmbilAlih && window.__lspAmbilAlih.has("python"))
              return Promise.resolve(null);
            return fetch("/pyintel", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                op: op,
                code: model.getValue(),
                line: position.lineNumber,
                column: position.column - 1,
                // Model kini membawa URI berkas sungguhan, dan itulah yang
                // membuat Jedi bisa menyeberang ke modul lain.
                path:
                  model.uri && model.uri.fsPath ? model.uri.fsPath : undefined,
              }),
            })
              .then(function (r) {
                return r.json();
              })
              .catch(function () {
                return { ok: false };
              });
          }

          function pyTempat(t) {
            var kol = (t.column || 0) + 1;
            var panjang = t.name ? String(t.name).length : 0;
            return {
              uri: window.monaco.Uri.file(t.path),
              range: {
                startLineNumber: t.line || 1,
                startColumn: kol,
                endLineNumber: t.line || 1,
                endColumn: kol + panjang,
              },
            };
          }

          // Hasil tanpa path, atau yang menunjuk ke dalam CPython sendiri,
          // dibuang: melompat ke sana jarang yang dimaui, dan berkasnya belum
          // tentu ada di disk.
          function pyBisaDilompati(t) {
            return t && t.path && !t.builtin;
          }

          window.monaco.languages.registerHoverProvider("python", {
            provideHover: function (model, position) {
              return pyMinta("hover", model, position).then(function (d) {
                if (!d || !d.ok || !d.hasil || !d.hasil.length) return null;
                var h = d.hasil[0];
                var isi = [];
                if (h.description) isi.push({ value: h.description });
                if (h.doc) isi.push({ value: h.doc });
                return isi.length ? { contents: isi } : null;
              });
            },
          });

          window.monaco.languages.registerDefinitionProvider("python", {
            provideDefinition: function (model, position) {
              return pyMinta("goto", model, position).then(function (d) {
                if (!d || !d.ok || !d.hasil) return null;
                return d.hasil.filter(pyBisaDilompati).map(pyTempat);
              });
            },
          });

          window.monaco.languages.registerReferenceProvider("python", {
            provideReferences: function (model, position) {
              return pyMinta("references", model, position).then(function (d) {
                if (!d || !d.ok || !d.hasil) return null;
                return d.hasil.filter(pyBisaDilompati).map(pyTempat);
              });
            },
          });
          // Tema sendiri, dengan latar TRANSPARAN.
          //
          // vs-dark memaksa #1e1e1e, dan itu tak sama dengan satu pun permukaan
          // aplikasi ini — editor jadi kotak abu di atas panel yang warnanya
          // lain. Tema Monaco bersifat GLOBAL (opsi `theme` saat create
          // mengubahnya untuk semua editor), jadi mematoknya ke satu warna cuma
          // memindahkan ketidakcocokan ke editor yang duduk di permukaan lain.
          //
          // Latar transparan membuat tiap editor mengambil warna wadahnya
          // sendiri: keluaran tool ikut .ar-out, blok kode ikut gelembungnya,
          // dan panel kode ikut warna panel berkas.
          // ── THE THEME NOW CARRIES SYNTAX COLOURS ──
          //
          // It used to be `rules: []` — not one syntax rule — so every colour
          // came from Monaco's built-in vs-dark, which is "Visual Studio Dark"
          // from 2015. tema-editor.js is generated from VS Code 1.136.1's own
          // default ("Dark 2026"): 335 colours and the token rules its scopes
          // map onto. The transparent background survives, because that is a
          // decision of this app rather than of the theme.
          //
          // The fallback is the OLD object, verbatim: if the generated file is
          // missing the editor must still come up, and it must come up looking
          // the way it did rather than not at all.
          window.monaco.editor.defineTheme(
            "wolfspace-gelap",
            window.__TEMA_EDITOR || {
              base: "vs-dark",
              inherit: true,
              rules: [],
              colors: {
                "editor.background": "#00000000",
                "editorGutter.background": "#00000000",
                "minimap.background": "#00000000",
                "editorLineNumber.foreground": "#4b5563",
                "editorLineNumber.activeForeground": "#8b98a9",
              },
            },
          );
          res(window.monaco);
        });
      });
    </script>
    <script type="text/javascript">
      // Babel Sandbox with Auto-Rollback: Catch syntax & runtime errors
      window._pendingGoodApp = null;
      window.reportAppSuccess = function () {
        if (window._pendingGoodApp) {
          try {
            localStorage.setItem(
              "wolfspace_last_good_app",
              window._pendingGoodApp,
            );
            console.log(
              "✅ WOLFSPACE app rendered successfully. Pinning this build as the Safe version.",
            );
          } catch (e) {
            // QuotaExceededError dsb: versi aman lama tetap terjaga, jangan meledak di alur render
            console.error(
              "⚠ Failed to pin the Safe version (localStorage full?):",
              e.message,
            );
          }
          window._pendingGoodApp = null;
        }
      };

      // ── Global Runtime Guard: tangkap error di luar jangkauan ErrorBoundary ──
      // (event handler, setTimeout, async/await) → picu Auto-Rollback yang sama.
      window.triggerAppRollback = function (errText) {
        // Abaikan error JINAK yang BUKAN crash app — jangan rollback/reload karenanya.
        // Penyebab "reload sendiri saat proses jalan": clipboard.writeText DITOLAK
        // saat window tak fokus (NotAllowedError: Document is not focused) → menjadi
        // unhandledrejection → dulu memicu rollback. Juga: ResizeObserver loop,
        // fetch AbortError (pembatalan streaming). Semua ini tak merusak app.
        var _benign =
          /NotAllowedError|Clipboard|writeText|Document is not focused|ResizeObserver loop|AbortError/i;
        if (_benign.test(String(errText || ""))) {
          console.warn("⚠ Benign error ignored (no rollback):", errText);
          return;
        }
        try {
          // Anti-loop: kalau baru saja rollback (<60 detik), jangan reload lagi —
          // versi aman pun melempar error yang sama, cukup catat di console.
          var last = parseInt(
            sessionStorage.getItem("wolfspace_rollback_ts") || "0",
            10,
          );
          if (Date.now() - last < 60000) {
            console.error(
              "⚠ Rollback ditahan (baru terjadi <60 dtk). Error:",
              errText,
            );
            return;
          }
          sessionStorage.setItem("wolfspace_rollback_ts", String(Date.now()));
          sessionStorage.setItem("wolfspace_rollback_error", errText);
        } catch (_) {}
        if (window.location.search.indexOf("rollback=true") === -1) {
          window.location.replace("/?rollback=true");
        }
      };
      window.addEventListener("error", function (ev) {
        // Abaikan error resource (img/script gagal load) — hanya exception JS
        if (!ev || !ev.error) return;
        window.triggerAppRollback(
          "[window.onerror] " + (ev.error.stack || ev.message || ev.error),
        );
      });
      window.addEventListener("unhandledrejection", function (ev) {
        var r = ev && ev.reason;
        window.triggerAppRollback(
          "[unhandledrejection] " + (r && r.stack ? r.stack : String(r)),
        );
      });

      window.loadApp = async function (opsi) {
        // 1. Cek apakah kita sedang dalam mode Recovery (Auto-Rollback dari Runtime Error)
        if (window.location.search.includes("rollback=true")) {
          console.warn("Entering Auto-Rollback mode for a runtime error…");

          const rollErr = sessionStorage.getItem("wolfspace_rollback_error");
          if (rollErr) {
            console.error(
              "💥 RUNTIME ERROR RECORD THAT CAUSED THE CRASH:\n",
              rollErr,
            );
            sessionStorage.removeItem("wolfspace_rollback_error");
          }

          // Hapus param agar refresh selanjutnya kembali normal
          const newUrl =
            window.location.protocol +
            "//" +
            window.location.host +
            window.location.pathname;
          window.history.replaceState({ path: newUrl }, "", newUrl);

          const lastGood = localStorage.getItem("wolfspace_last_good_app");
          if (lastGood) {
            console.log(
              "✅ Restoring the UI from the last Safe version (Runtime Auto-Rollback).",
            );
            const script = document.createElement("script");
            script.type = "text/javascript";
            script.innerHTML = lastGood;
            document.body.appendChild(script);
            return; // Hentikan eksekusi fetch
          }
        }

        // Menyuntikkan kode terkompilasi. SATU jalur untuk kedua sumber — yang
        // prebuilt dan yang dikompilasi Babel — supaya Auto-Rollback dan
        // pembersihan blok HMR tak bisa menyimpang antara keduanya.
        const suntik = (compiled) => {
          // TAHAN! Jangan simpan ke localStorage dulu sampai React merendernya tanpa error
          window._pendingGoodApp = compiled;

          // Buang blok HMR SEBELUMNYA sebelum menyuntik yang baru. Tiap
          // loadApp() menambah satu <script> berisi ~500KB kode terkompilasi;
          // tanpa pembersihan, sesi dev panjang menumpuk puluhan blok yang tak
          // bisa di-GC karena masih tersangkut di DOM. Kode yang SUDAH
          // dieksekusi tetap hidup lewat closure-nya — yang dibebaskan di sini
          // teks sumbernya, bukan aplikasi yang sedang berjalan.
          document
            .querySelectorAll("script[data-wolfspace-hmr]")
            .forEach((s) => s.remove());

          const script = document.createElement("script");
          script.type = "text/javascript";
          script.setAttribute("data-wolfspace-hmr", "1");
          script.innerHTML = compiled;
          document.body.appendChild(script);
        };

        // ── Jalur CEPAT: renderer yang sudah dibangun ──
        //
        // 631 KB lewat Babel DI DALAM halaman, tiap kali aplikasi dibuka,
        // sebelum satu piksel tergambar — probe aplikasi ini mencatat
        // RENDERER-STOP ~3101 ms. scripts/build-app.cjs memindahkannya ke waktu
        // build, pola yang sudah dipakai preload.ts (~154 ms) dan main.ts
        // (~286 ms) dengan alasan yang sama.
        //
        // DILEWATI saat HMR: agent menyunting sumber UI-nya sendiri, jadi di
        // saat itu berkas prebuilt sudah pasti basi dan Babel-lah yang benar.
        // Dilewati juga kalau berkasnya tak ada — clone baru sebelum ada yang
        // membangun apa pun tetap jalan, hanya lebih lambat.
        if (!(opsi && opsi.segar)) {
          try {
            const pra = await fetch("/app.build.js?v=" + Date.now());
            if (pra.ok) {
              const kode = await pra.text();
              console.log(
                "[app] memakai renderer prebuilt (" + kode.length + " bytes)",
              );
              suntik(kode);
              return;
            }
          } catch (_) {
            // Tak ada prebuilt — turun ke jalur Babel di bawah.
          }
        }

        // 2. Alur Normal
        try {
          // Modul yang diekstrak dari app.tsx dipecah ke file terpisah, lalu di-CONCAT
          // SEBELUM app.tsx dan ditransform SEKALI — jadi tetap satu scope global. Urutan
          // PREPEND ini penting: sebagian komponen (Sidebar/Composer/Icons) dirender saat
          // awal, jadi definisinya harus ada sebelum App di-render di akhir app.tsx.
          // Body fungsi (memakai hooks/React dari app.tsx) baru jalan saat render — setelah
          // seluruh skrip termuat. Auto-Rollback di bawah tetap utuh. Tambah file = +1 entri.
          const APP_MODULES = [
            "/app/Config.tsx",
            "/app/IkonBahasa.ts",
            "/app/Lsp.ts",
            "/app/AgentDiff.ts",
            "/app/TemaTerminalVSCode.ts",
            "/app/Viewport.tsx",
            "/app/Icons.tsx",
            "/app/Model3DViewer.tsx",
            "/app/VisualTools.tsx",
            "/app/CodeBlocks.tsx",
            "/app/Views.tsx",
            "/app/Components.tsx",
            "/app/Screens.tsx",
            "/app/Sidebar.tsx",
            "/app/AgentSteps.tsx",
            "/app/usePreviewPanel.tsx",
          ];
          // Kumpulkan tiap modul sebagai potongan TERPISAH (bukan satu string raksasa).
          const parts = [];
          for (const m of APP_MODULES) {
            try {
              const mr = await fetch(m + "?v=" + Date.now());
              if (mr.ok) parts.push({ name: m, src: await mr.text() });
              else
                console.error("Module failed to load (" + mr.status + "):", m);
            } catch (me) {
              console.error("Modul error:", m, me);
            }
          }
          parts.push({
            name: "/app.tsx",
            src: await (await fetch("/app.tsx?v=" + Date.now())).text(),
          });

          // BABEL DIMUAT DI SINI, bukan saat aplikasi start.
          //
          // Terukur 580 ms dari 11795 ms total vendor, dan dibayar pada SETIAP
          // start — padahal baris ini hanya tercapai lewat HMR (agent menyunting
          // sumber UI-nya sendiri) atau ketika app.build.js tak ada. Jalur normal
          // memakai berkas prebuilt dan `return` jauh sebelum sampai ke sini.
          //
          // Ditunggu, bukan ditembak-dan-lupakan: baris berikutnya memanggil
          // Babel.transform secara langsung.
          if (window.__muatBabel) await window.__muatBabel();

          try {
            // Transpile PER-MODUL lalu gabung hasilnya (di-inject sbagai SATU <script>,
            // jadi tetap satu scope global — hoisting antar-file tak berubah). Dgn tiap
            // input Babel < 500KB, @babel/generator tak lagi men-"deoptimise" styling →
            // note "exceeds the max of 500KB" hilang, DAN output tak dipaksa compact
            // sehingga stack-trace tetap terbaca. `filename` bikin pesan Babel menyebut
            // modul yang benar (bukan "undefined").
            let compiled = parts
              .map(
                (p) =>
                  Babel.transform(p.src, {
                    // Preset typescript HANYA untuk .ts/.tsx. Bundel Babel yang
                    // di-vendor (7.29.0) sudah memuatnya, jadi TSX jalan tanpa
                    // build step — sama seperti JSX selama ini. Berkas .jsx yang
                    // sudah ada sengaja tak ikut: parser TS lebih ketat di
                    // beberapa tempat, dan tak ada alasan mempertaruhkannya.
                    presets: /\.tsx?$/.test(p.name)
                      ? ["react", "typescript"]
                      : ["react"],
                    filename: p.name,
                  }).code,
              )
              .join("\n;\n");

            // Wrap in an IIFE so const/let declarations don't collide on HMR re-renders
            compiled = `(() => {\n${compiled}\n})();`;

            suntik(compiled);
          } catch (compileError) {
            console.error("💥 Babel Compilation Error:", compileError);
            console.warn(
              "Reloading from the last version that worked (Syntax Auto-Rollback)…",
            );

            const lastGood = localStorage.getItem("wolfspace_last_good_app");
            if (lastGood) {
              console.log(
                "✅ Syntax Auto-Rollback succeeded. The WOLFSPACE UI was recovered.",
              );
              const script = document.createElement("script");
              script.type = "text/javascript";
              script.innerHTML = lastGood;
              document.body.appendChild(script);
            } else {
              console.error(
                "❌ Auto-Rollback failed: no previous version available.",
              );
            }
          }
        } catch (fetchError) {
          console.error("Failed to fetch app.tsx:", fetchError);
        }
      };

      // Jalankan aplikasi pertama kali
      window.loadApp();

      // Listener untuk True Frontend HMR (Tanpa Reload Jendela)
      if (window.WOLFSPACE && window.WOLFSPACE.onHmr) {
        window.WOLFSPACE.onHmr((filename) => {
          if (filename.endsWith(".css")) {
            console.log(
              "[hmr] Menerapkan perubahan CSS secara realtime:",
              filename,
            );
            const links = document.querySelectorAll("link[rel='stylesheet']");
            links.forEach((link) => {
              if (link.href.includes(filename.split(/[/\\]/).pop())) {
                link.href = link.href.split("?")[0] + "?v=" + Date.now();
              }
            });
          } else if (filename.endsWith("app.build.js")) {
            // Berkas INI adalah renderer yang sudah dibangun. Mengkompilasinya
            // ulang dari sumber justru terbalik: jalur prebuilt tak butuh Babel
            // sama sekali. Sebelum cabang ini ada, tiap `npm run build:app`
            // selagi aplikasi hidup melempar aplikasinya ke jalur Babel.
            console.log("[hmr] renderer prebuilt dibangun ulang:", filename);
            window.loadApp();
          } else if (filename.endsWith(".jsx") || filename.endsWith(".js")) {
            console.log(
              "[hmr] Re-injecting React components (Soft Refresh):",
              filename,
            );
            // segar: kompilasi dari sumber. Berkas prebuilt sudah basi begitu
            // ada yang menyunting, dan HMR ada justru untuk saat itu.
            window.loadApp({ segar: true });
          } else {
            console.log("[hmr] Change requires a hard reload:", filename);
            window.location.reload();
          }
        });
      }
    </script>
  </body>
</html>
