<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Logic — Prototype</title>
    <style>
      /* Warna dicocokkan dengan panel Logic asli di app.jsx:
     surface-1 #0f1318 · line #282e36 · kanvas #0d1117 · teks #e2e8f0 */
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: #0d1117;
        color: #e2e8f0;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        font-size: 13px;
        display: flex;
        overflow: hidden;
      }

      /* ────────── SIDEBAR FILE (kiri) — replika screenshot 2 ────────── */
      .sidebar {
        width: 264px;
        flex-shrink: 0;
        background: #0f1318;
        border-right: 1px solid #282e36;
        display: flex;
        flex-direction: column;
        user-select: none;
      }
      .sb-head {
        display: flex;
        align-items: center;
        height: 40px;
        padding: 0 8px 0 12px;
        border-bottom: 1px solid #21262d;
        gap: 4px;
      }
      .sb-tabs {
        display: flex;
        gap: 16px;
        flex: 1;
      }
      .sb-tab {
        font-size: 13px;
        color: #6b7280;
        cursor: pointer;
        padding: 10px 0;
        position: relative;
        letter-spacing: 0.01em;
      }
      .sb-tab:hover {
        color: #b6c2cf;
      }
      .sb-tab.active {
        color: #e6edf3;
      }
      .sb-tab.active::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        bottom: -1px;
        height: 2px;
        background: #4c8bf5;
        border-radius: 2px;
      }
      .sb-actions {
        display: flex;
        align-items: center;
        gap: 6px;
        color: #6b7280;
      }
      .sb-actions button {
        background: transparent;
        border: none;
        color: inherit;
        cursor: pointer;
        width: 24px;
        height: 24px;
        border-radius: 5px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .sb-actions button:hover {
        background: #1c2530;
        color: #b6c2cf;
      }

      .sb-tree {
        flex: 1;
        overflow-y: auto;
        padding: 6px 0;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 6px;
        height: 24px;
        padding: 0 10px;
        cursor: pointer;
        color: #adbac7;
        white-space: nowrap;
      }
      .row:hover {
        background: #1c2530;
      }
      .row .chev {
        width: 12px;
        height: 12px;
        flex-shrink: 0;
        color: #768390;
        transition: transform 0.12s;
      }
      .row .ic {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
        display: inline-flex;
      }
      .row .nm {
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .indent-1 {
        padding-left: 20px;
      }
      .indent-2 {
        padding-left: 30px;
      }
      .folder .nm {
        color: #cdd9e5;
      }

      /* ────────── PANEL LOGIC (kanan) ────────── */
      .logic {
        flex: 1;
        display: flex;
        flex-direction: column;
        background: #0f1318;
        min-width: 0;
      }
      .logic-head {
        height: 46px;
        flex-shrink: 0;
        border-bottom: 1px solid #282e36;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 14px;
        gap: 10px;
      }
      .logic-title {
        display: flex;
        align-items: center;
        gap: 8px;
        color: #e2e8f0;
        font-size: 13px;
        font-weight: 600;
      }
      .logic-title .sub {
        font-size: 11px;
        font-weight: 400;
        color: #6b7280;
      }
      .logic-close {
        background: transparent;
        border: none;
        color: #8b98a9;
        cursor: pointer;
        padding: 4px 6px;
        border-radius: 4px;
        display: flex;
        align-items: center;
      }
      .logic-close:hover {
        background: rgba(248, 81, 73, 0.15);
        color: #f85149;
      }

      /* Kanvas grid titik — sama seperti asli */
      .canvas {
        flex: 1;
        position: relative;
        overflow: hidden;
        background: #0d1117;
        background-image: radial-gradient(
          rgba(255, 255, 255, 0.06) 1px,
          transparent 1px
        );
        background-size: 22px 22px;
      }
      .empty {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        text-align: center;
        color: #5b6673;
        font-size: 13px;
        pointer-events: none;
      }
      .empty .glyph {
        opacity: 0.5;
        color: #3a444f;
      }
      .empty .h {
        font-weight: 600;
        color: #8b98a9;
      }
      .empty .d {
        max-width: 340px;
        line-height: 1.6;
      }

      /* Pill mengambang samar "+ Tambah first step" (seperti di screenshot 1) */
      .pill {
        position: absolute;
        top: 150px;
        left: 50%;
        transform: translateX(-50%);
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 7px 14px;
        background: rgba(22, 28, 36, 0.55);
        border: 1px dashed #2c3542;
        border-radius: 8px;
        color: #6b7683;
        font-size: 12px;
        backdrop-filter: blur(2px);
        cursor: pointer;
      }
      .pill:hover {
        color: #9aa7b4;
        border-color: #3a4552;
      }
    </style>
  </head>
  <body>
    <!-- ══════════ SIDEBAR FILE ══════════ -->
    <aside class="sidebar">
      <div class="sb-head">
        <div class="sb-tabs">
          <span class="sb-tab">Changes</span>
          <span class="sb-tab active">Files</span>
        </div>
        <div class="sb-actions">
          <button title="Cari">
            <svg
              width="15"
              height="15"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            >
              <circle cx="11" cy="11" r="7" />
              <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
          </button>
          <button title="Ciutkan semua">
            <svg
              width="15"
              height="15"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <polyline points="4 14 10 14 10 20" />
              <polyline points="20 10 14 10 14 4" />
              <line x1="14" y1="10" x2="21" y2="3" />
              <line x1="3" y1="21" x2="10" y2="14" />
            </svg>
          </button>
        </div>
      </div>

      <div class="sb-tree" id="tree"></div>
    </aside>

    <!-- ══════════ PANEL LOGIC ══════════ -->
    <main class="logic">
      <div class="logic-head">
        <div class="logic-title">
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="3" y="4" width="6" height="5" rx="1"></rect>
            <rect x="15" y="9" width="6" height="5" rx="1"></rect>
            <rect x="9" y="15" width="6" height="5" rx="1"></rect>
            <path d="M9 6.5h3a2 2 0 0 1 2 2v.5M9 17.5H6a2 2 0 0 1-2-2V9"></path>
          </svg>
          <span>Logic</span>
          <span class="sub"
            >· kanvas React Flow untuk mengendalikan website</span
          >
        </div>
        <button class="logic-close" title="Tutup Logic">
          <svg
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>
      </div>

      <div class="canvas">
        <div class="pill">
          <svg
            width="12"
            height="12"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          >
            <line x1="12" y1="5" x2="12" y2="19" />
            <line x1="5" y1="12" x2="19" y2="12" />
          </svg>
          Tambah first step
        </div>
        <div class="empty">
          <svg
            class="glyph"
            width="40"
            height="40"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="3" y="4" width="6" height="5" rx="1"></rect>
            <rect x="15" y="9" width="6" height="5" rx="1"></rect>
            <rect x="9" y="15" width="6" height="5" rx="1"></rect>
            <path d="M9 6.5h3a2 2 0 0 1 2 2v.5M9 17.5H6a2 2 0 0 1-2-2V9"></path>
          </svg>
          <div class="h">Kanvas Logic</div>
          <div class="d">
            Di sini nanti React Flow difungsikan — node &amp; edge untuk
            mengendalikan website. Untuk sekarang, tampilan kosong.
          </div>
        </div>
      </div>
    </main>

    <script>
      // ── Ikon file (SVG inline) ──
      const IC = {
        file: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#768390" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="16" y2="17"/></svg>',
        folderOpen:
          '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#54aeff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h6a2 2 0 0 1 2 2v1H3z"/><path d="M3 10h18l-1.5 8a2 2 0 0 1-2 1.6H6.5a2 2 0 0 1-2-1.6z"/></svg>',
        pdf: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#f85149" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><text x="12" y="18" font-size="6" fill="#f85149" stroke="none" text-anchor="middle" font-family="monospace">PDF</text></svg>',
        key: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#e3b341" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="4.5"/><path d="M10.7 12.3 20 3"/><path d="m17 6 3 3"/><path d="m15 8 2 2"/></svg>',
        info: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#54aeff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><line x1="12" y1="11" x2="12" y2="16"/><circle cx="12" cy="8" r="0.6" fill="#54aeff"/></svg>',
      };
      const chev =
        '<svg class="chev" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="transform:rotate(90deg)"><path d="M6 4l4 4-4 4"/></svg>';

      // ── Daftar file persis screenshot 2 ──
      const files = [
        ["AUTHORS", "file"],
        ["ChangeLog", "info"],
        ["COPYING", "key"],
        ["mkbitmap.1", "file"],
        ["mkbitmap.exe", "file"],
        ["NEWS", "file"],
        ["placement.pdf", "pdf"],
        ["potrace.1", "file"],
        ["potrace.exe", "file"],
        ["README", "info"],
        ["README-WIN", "file"],
      ];

      const tree = document.getElementById("tree");
      const folderRow = (name, indent) => {
        const d = document.createElement("div");
        d.className = "row folder" + (indent ? " indent-" + indent : "");
        d.innerHTML =
          chev +
          '<span class="ic">' +
          IC.folderOpen +
          '</span><span class="nm">' +
          name +
          "</span>";
        return d;
      };
      const fileRow = (name, kind) => {
        const d = document.createElement("div");
        d.className = "row indent-2";
        d.innerHTML =
          '<span style="width:12px"></span><span class="ic">' +
          (IC[kind] || IC.file) +
          '</span><span class="nm">' +
          name +
          "</span>";
        return d;
      };

      tree.appendChild(folderRow("potrace-1.16.win64", 0));
      tree.appendChild(folderRow("potrace-1.16.win64", 1));
      for (const [nm, kind] of files) tree.appendChild(fileRow(nm, kind));

      // interaksi ringan: klik tab
      document.querySelectorAll(".sb-tab").forEach((t) =>
        t.addEventListener("click", () => {
          document
            .querySelectorAll(".sb-tab")
            .forEach((x) => x.classList.remove("active"));
          t.classList.add("active");
        }),
      );
    </script>
  </body>
</html>
