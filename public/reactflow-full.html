<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>React Flow — Showcase Penuh</title>
    <link rel="stylesheet" href="/vendor/reactflow.css" />
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }
      * {
        box-sizing: border-box;
      }
      body {
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        background: #0b0e14;
      }
      .wrap {
        display: flex;
        height: 100%;
      }

      /* ── Palette (drag sumber node) ── */
      .palette {
        width: 176px;
        flex-shrink: 0;
        background: #0e131b;
        border-right: 1px solid #1e2733;
        padding: 12px 10px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        color: #c7d3e0;
      }
      .palette h4 {
        margin: 2px 2px 6px;
        font-size: 10px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #5b6b7e;
      }
      .pitem {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 9px;
        border-radius: 9px;
        cursor: grab;
        background: #131a24;
        border: 1px solid #1f2a37;
        border-left: 3px solid var(--a);
        font-size: 12.5px;
        color: #dbe4ee;
        user-select: none;
      }
      .pitem:hover {
        background: #182231;
      }
      .pitem .pic {
        width: 20px;
        height: 20px;
        display: grid;
        place-items: center;
        border-radius: 6px;
        font-size: 12px;
        background: color-mix(in srgb, var(--a) 22%, transparent);
      }
      .palette small {
        margin-top: auto;
        color: #4a5a6d;
        font-size: 10.5px;
        line-height: 1.5;
      }

      .canvas {
        flex: 1;
        position: relative;
        min-width: 0;
      }

      /* ── Node custom ── */
      .rf-card {
        width: 190px;
        background: #141b26;
        border: 1px solid #24303f;
        border-left: 3px solid var(--a);
        border-radius: 10px;
        padding: 9px 11px;
        color: #e6edf5;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
        font-size: 12px;
      }
      .rf-card.sel {
        box-shadow:
          0 0 0 2px var(--a),
          0 6px 20px rgba(0, 0, 0, 0.5);
      }
      .rf-head {
        display: flex;
        align-items: center;
        gap: 9px;
      }
      .rf-ic {
        width: 28px;
        height: 28px;
        flex-shrink: 0;
        display: grid;
        place-items: center;
        border-radius: 8px;
        font-size: 15px;
        background: color-mix(in srgb, var(--a) 20%, transparent);
        color: var(--a);
      }
      .rf-t {
        min-width: 0;
        flex: 1;
      }
      .rf-title {
        font-weight: 650;
        font-size: 12.5px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .rf-sub {
        font-size: 10.5px;
        color: #8394a6;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .rf-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--a);
        box-shadow: 0 0 8px var(--a);
        flex-shrink: 0;
      }
      .rf-h {
        width: 9px !important;
        height: 9px !important;
        background: var(--a) !important;
        border: 2px solid #0b0e14 !important;
      }

      /* ── Edge button (hapus) + label ── */
      .rf-edge-btn {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        border: 1px solid #33465c;
        background: #0e131b;
        color: #9fb0c3;
        font-size: 12px;
        line-height: 1;
        cursor: pointer;
        display: grid;
        place-items: center;
        padding: 0;
      }
      .rf-edge-btn:hover {
        background: #3a1620;
        border-color: #f0776b;
        color: #f0776b;
      }
      .rf-edge-lbl {
        padding: 1px 7px;
        border-radius: 9px;
        font-size: 10px;
        font-weight: 600;
        background: #0e131b;
        border: 1px solid #24303f;
        color: #9fb0c3;
      }

      /* ── Panel demo ── */
      .demo-panel {
        background: #0e131b;
        border: 1px solid #1f2a37;
        border-radius: 11px;
        padding: 11px 12px;
        min-width: 210px;
        color: #e6edf5;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      }
      .demo-panel strong {
        font-size: 12.5px;
      }
      .demo-row {
        display: flex;
        gap: 6px;
        margin-top: 8px;
        flex-wrap: wrap;
      }
      .demo-panel button {
        font: inherit;
        font-size: 11.5px;
        padding: 5px 9px;
        border-radius: 7px;
        cursor: pointer;
        border: 1px solid #2a3746;
        background: #161f2b;
        color: #dbe4ee;
      }
      .demo-panel button:hover {
        background: #1d2836;
      }
      .demo-panel button.on {
        background: #4c8bf5;
        border-color: #4c8bf5;
        color: #fff;
      }
      .demo-panel small {
        display: block;
        margin-top: 9px;
        color: #5b6b7e;
        font-size: 10.5px;
        line-height: 1.55;
      }

      /* light mode overrides */
      .react-flow:not(.dark) ~ * .demo-panel {
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="/vendor/react.production.min.js"></script>
    <script src="/vendor/react-dom.production.min.js"></script>
    <script src="/vendor/reactflow.bundle.js"></script>
    <script src="/vendor/babel.min.js"></script>

    <script type="text/babel" data-presets="react">
      const { useCallback, useState, useRef } = React;
      const XY = window.RFLib.XY;
      const {
        ReactFlow,
        ReactFlowProvider,
        MiniMap,
        Controls,
        Background,
        Panel,
        Handle,
        Position,
        NodeResizer,
        BaseEdge,
        EdgeLabelRenderer,
        getSmoothStepPath,
        useNodesState,
        useEdgesState,
        addEdge,
        useReactFlow,
        MarkerType,
      } = XY;
      const arrow = { type: MarkerType.ArrowClosed, width: 16, height: 16 };

      // ── Node custom (kartu integrasi) ──
      function FlowCard({ data, selected }) {
        return (
          <div
            className={"rf-card" + (selected ? " sel" : "")}
            style={{ "--a": data.accent, width: data.w }}
          >
            {data.resizable && (
              <NodeResizer
                color={data.accent}
                isVisible={selected}
                minWidth={170}
                minHeight={54}
              />
            )}
            <Handle type="target" position={Position.Left} className="rf-h" />
            <div className="rf-head">
              <span className="rf-ic">{data.icon}</span>
              <div className="rf-t">
                <div className="rf-title">{data.label}</div>
                {data.sub && <div className="rf-sub">{data.sub}</div>}
              </div>
              <span className="rf-dot" />
            </div>
            <Handle type="source" position={Position.Right} className="rf-h" />
          </div>
        );
      }

      // ── Edge custom: smoothstep + tombol hapus (+ label opsional) ──
      function ButtonEdge({
        id,
        sourceX,
        sourceY,
        targetX,
        targetY,
        sourcePosition,
        targetPosition,
        markerEnd,
        style,
        data,
      }) {
        const [path, lx, ly] = getSmoothStepPath({
          sourceX,
          sourceY,
          sourcePosition,
          targetX,
          targetY,
          targetPosition,
        });
        const rf = useReactFlow();
        return (
          <>
            <BaseEdge id={id} path={path} markerEnd={markerEnd} style={style} />
            <EdgeLabelRenderer>
              <div
                className="nodrag nopan"
                style={{
                  position: "absolute",
                  transform: `translate(-50%,-50%) translate(${lx}px,${ly}px)`,
                  display: "flex",
                  alignItems: "center",
                  gap: "6px",
                  pointerEvents: "all",
                }}
              >
                {data && data.label && (
                  <span
                    className="rf-edge-lbl"
                    style={{
                      borderColor: data.color || "#24303f",
                      color: data.color || "#9fb0c3",
                    }}
                  >
                    {data.label}
                  </span>
                )}
                <button
                  className="rf-edge-btn"
                  title="hapus edge"
                  onClick={() =>
                    rf.setEdges((es) => es.filter((e) => e.id !== id))
                  }
                >
                  ×
                </button>
              </div>
            </EdgeLabelRenderer>
          </>
        );
      }

      const nodeTypes = { card: FlowCard };
      const edgeTypes = { button: ButtonEdge };

      const N = (id, x, y, d) => ({
        id,
        type: "card",
        position: { x, y },
        data: d,
      });
      const initialNodes = [
        N("1", 20, 140, {
          label: "Webhook",
          sub: "trigger masuk",
          icon: "⚡",
          accent: "#3fb950",
        }),
        N("2", 250, 140, {
          label: "HTTP Request",
          sub: "GET api.github.com",
          icon: "🌐",
          accent: "#2f81f7",
          resizable: true,
        }),
        N("3", 500, 60, {
          label: "Transform",
          sub: "ambil field JSON",
          icon: "🧮",
          accent: "#d29922",
        }),
        N("4", 500, 230, {
          label: "Branch",
          sub: "if status ok?",
          icon: "🔀",
          accent: "#bc8cff",
        }),
        N("5", 760, 60, {
          label: "Database",
          sub: "simpan hasil",
          icon: "🗄️",
          accent: "#2dd4bf",
        }),
        N("6", 760, 230, {
          label: "Notify",
          sub: "kirim Slack",
          icon: "🔔",
          accent: "#f85149",
        }),
      ];
      const E = (id, s, t, extra = {}) => ({
        id,
        source: s,
        target: t,
        type: "button",
        markerEnd: arrow,
        ...extra,
      });
      const initialEdges = [
        E("e12", "1", "2", { animated: true }),
        E("e23", "2", "3"),
        E("e24", "2", "4"),
        E("e35", "3", "5"),
        E("e45o", "4", "5", { data: { label: "ok", color: "#3fb950" } }),
        E("e46f", "4", "6", { data: { label: "gagal", color: "#f85149" } }),
      ];

      const PALETTE = [
        { label: "Webhook", sub: "trigger", icon: "⚡", accent: "#3fb950" },
        {
          label: "HTTP Request",
          sub: "panggil API",
          icon: "🌐",
          accent: "#2f81f7",
        },
        { label: "Transform", sub: "olah data", icon: "🧮", accent: "#d29922" },
        { label: "Branch", sub: "if / else", icon: "🔀", accent: "#bc8cff" },
        { label: "Database", sub: "simpan", icon: "🗄️", accent: "#2dd4bf" },
        { label: "Notify", sub: "kirim pesan", icon: "🔔", accent: "#f85149" },
      ];

      function Flow() {
        const [nodes, setNodes, onNodesChange] = useNodesState(initialNodes);
        const [edges, setEdges, onEdgesChange] = useEdgesState(initialEdges);
        const [variant, setVariant] = useState("dots");
        const [dark, setDark] = useState(true);
        const idRef = useRef(100);
        const rf = useReactFlow();

        const onConnect = useCallback(
          (c) =>
            setEdges((eds) =>
              addEdge(
                { ...c, type: "button", markerEnd: arrow, animated: true },
                eds,
              ),
            ),
          [setEdges],
        );
        const onDragOver = useCallback((e) => {
          e.preventDefault();
          e.dataTransfer.dropEffect = "move";
        }, []);
        const onDrop = useCallback(
          (e) => {
            e.preventDefault();
            const raw = e.dataTransfer.getData("application/rfnode");
            if (!raw) return;
            const item = JSON.parse(raw);
            const pos = rf.screenToFlowPosition({ x: e.clientX, y: e.clientY });
            setNodes((nds) =>
              nds.concat({
                id: "n" + idRef.current++,
                type: "card",
                position: pos,
                data: item,
              }),
            );
          },
          [rf, setNodes],
        );

        const autoLayout = () => {
          const dagre = window.RFLib.dagre;
          const g = new dagre.graphlib.Graph();
          g.setGraph({ rankdir: "LR", nodesep: 45, ranksep: 90 });
          g.setDefaultEdgeLabel(() => ({}));
          nodes.forEach((n) =>
            g.setNode(n.id, { width: n.data.w || 190, height: 64 }),
          );
          edges.forEach((e) => g.setEdge(e.source, e.target));
          dagre.layout(g);
          setNodes((nds) =>
            nds.map((n) => {
              const p = g.node(n.id);
              return p
                ? {
                    ...n,
                    position: { x: p.x - (n.data.w || 190) / 2, y: p.y - 32 },
                  }
                : n;
            }),
          );
          setTimeout(() => rf.fitView({ duration: 400, padding: 0.2 }), 60);
        };

        return (
          <div className="wrap">
            <div className="palette">
              <h4>Node — seret ke kanvas</h4>
              {PALETTE.map((it, i) => (
                <div
                  key={i}
                  className="pitem"
                  style={{ "--a": it.accent }}
                  draggable
                  onDragStart={(e) => {
                    e.dataTransfer.setData(
                      "application/rfnode",
                      JSON.stringify(it),
                    );
                    e.dataTransfer.effectAllowed = "move";
                  }}
                >
                  <span className="pic" style={{ "--a": it.accent }}>
                    {it.icon}
                  </span>
                  {it.label}
                </div>
              ))}
              <small>
                Ini React Flow penuh: node & edge custom, resize, drag-drop,
                minimap berwarna, auto-layout (dagre).
              </small>
            </div>

            <div className="canvas" onDrop={onDrop} onDragOver={onDragOver}>
              <ReactFlow
                nodes={nodes}
                edges={edges}
                onNodesChange={onNodesChange}
                onEdgesChange={onEdgesChange}
                onConnect={onConnect}
                nodeTypes={nodeTypes}
                edgeTypes={edgeTypes}
                colorMode={dark ? "dark" : "light"}
                fitView
                selectionOnDrag
                panOnDrag={[1, 2]}
                proOptions={{ hideAttribution: false }}
              >
                <MiniMap
                  zoomable
                  pannable
                  nodeColor={(n) => (n.data && n.data.accent) || "#4c8bf5"}
                  maskColor={dark ? "rgba(8,11,16,.7)" : "rgba(240,242,246,.7)"}
                />
                <Controls />
                <Background variant={variant} gap={18} size={1} />
                <Panel position="top-right">
                  <div className="demo-panel">
                    <strong>React Flow — showcase</strong>
                    <div className="demo-row">
                      <button onClick={autoLayout}>⇄ Auto-layout</button>
                      <button
                        onClick={() =>
                          rf.fitView({ duration: 300, padding: 0.2 })
                        }
                      >
                        ⤢ Fit
                      </button>
                    </div>
                    <div className="demo-row">
                      <button onClick={() => setDark((d) => !d)}>
                        {dark ? "☀ Light" : "🌙 Dark"}
                      </button>
                      {["dots", "lines", "cross"].map((v) => (
                        <button
                          key={v}
                          className={variant === v ? "on" : ""}
                          onClick={() => setVariant(v)}
                        >
                          {v}
                        </button>
                      ))}
                    </div>
                    <small>
                      Seret dari palet kiri · tarik antar-titik = sambung · klik
                      × di edge = hapus · sudut node HTTP bisa di-resize · seret
                      area kosong = select-box.
                    </small>
                  </div>
                </Panel>
              </ReactFlow>
            </div>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(
        <ReactFlowProvider>
          <Flow />
        </ReactFlowProvider>,
      );
    </script>
  </body>
</html>
