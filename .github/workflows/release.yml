# Builds the Windows installer and publishes it as a GitHub Release.
#
# SEPARATE FROM ci.yml ON PURPOSE. CI runs on every push to main and develop, and
# its Electron job deliberately packages with `--dir` only: an unpacked tree is
# enough to prove the package is COMPLETE, which is the bug class that job exists
# to catch. Building the NSIS installer as well would spend those minutes on
# every commit for an artifact nobody downloads. Here it runs when a version is
# actually being released, and nowhere else.
#
# WHAT A DOWNLOADER GETS. `WOLFSPACE Setup <version>.exe` — NSIS, per-user
# (`perMachine: false`), not one-click, and the install directory can be changed.
# No auto-update: `latest.yml` is deliberately NOT attached, because publishing it
# advertises an update feed this project does not run.

name: Release

on:
  push:
    tags: ["v*"]
  # Lets a release be re-cut from the Actions tab without moving a tag, which is
  # the usual reason a release build has to be repeated.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release (e.g. v0.1.0)"
        required: true

# Creating a release and uploading assets both write to the repository.
permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Installer (windows)
    runs-on: windows-latest
    # The CI job that only packages --dir allows 30 minutes. Producing the NSIS
    # installer on top of that is heavier, so this one is given more room rather
    # than being killed halfway through a release.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # THE TAG AND package.json MUST AGREE.
      #
      # electron-builder takes the version for the installer's filename and its
      # metadata from package.json, NOT from the tag. Without this check, tagging
      # v0.2.0 while package.json still says 0.1.0 produces a release named
      # v0.2.0 containing "WOLFSPACE Setup 0.1.0.exe" — a mismatch that looks
      # like a packaging bug long after the release is public.
      - name: Tag matches package.json version
        shell: bash
        run: |
          set -e
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          PKG="v$(node -p "require('./package.json').version")"
          echo "tag=$TAG  package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag $TAG does not match package.json $PKG — bump the version or move the tag"
            exit 1
          fi

      # Same reason as in ci.yml: electron/main.js and preload.js are BUILT, not
      # committed. electron-builder packages the file tree as it finds it, so
      # skipping this ships an app with no main process — a build that succeeds
      # and only breaks when someone runs it.
      - name: Build Electron artefacts
        run: npm run build:preload && npm run build:main && npm run build:app

      # AcLaunch.exe is the Windows AppContainer launcher, and it is GITIGNORED —
      # a clone has the C# source and no binary. Without this step the installer
      # ships without it, appcontainer-jail reports "AcLaunch.exe has not been
      # compiled" and falls back, and the released app quietly has weaker
      # confinement than a developer checkout. csc.exe comes with the .NET
      # Framework that is already part of Windows, so the runner needs nothing
      # installed.
      - name: Build AppContainer launcher
        run: npm run build:aclaunch

      - name: Build installer
        run: npx electron-builder --win --publish never

      # Building it is not the same as SHIPPING it. `build.files` is an
      # allowlist and `asarUnpack` decides what stays a real file on disk — an
      # .exe inside an .asar cannot be spawned at all. appcontainer-jail resolves
      # it as ../../scripts/appcontainer/AcLaunch.exe from agent/tools/, so it
      # has to land in app.asar.unpacked. Both entries were missing until this
      # release work; asserted here rather than assumed.
      - name: Check the launcher was packaged
        shell: bash
        run: |
          set -e
          EXE="dist-app/win-unpacked/resources/app.asar.unpacked/scripts/appcontainer/AcLaunch.exe"
          if [ ! -f "$EXE" ]; then
            echo "::error::$EXE missing — the release would ship without AppContainer confinement"
            find dist-app/win-unpacked/resources/app.asar.unpacked/scripts -maxdepth 2 2>/dev/null || true
            exit 1
          fi
          ls -la "$EXE"

      # A release whose asset is missing is worse than no release: the page looks
      # finished. Fail here instead.
      - name: Check the installer exists
        shell: bash
        run: |
          set -e
          ls -la dist-app/ || true
          COUNT=$(find dist-app -maxdepth 1 -name "*.exe" | wc -l)
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::no .exe produced in dist-app/"
            exit 1
          fi
          find dist-app -maxdepth 1 -name "*.exe" -printf "%f  %s bytes\n"

      # The checksum is computed BEFORE publishing because the release notes
      # quote it. Written the other way round, the notes promised a checksum
      # "below" that was produced in a later step and never reached the page.
      - name: Compose release notes
        shell: bash
        run: |
          set -e
          {
            echo "## Install"
            echo
            echo "Download the \`.exe\`, run it, and pick an install directory."
            echo "Per-user install — no administrator rights needed."
            echo
            echo "**Windows SmartScreen will warn on first run.** The installer is not"
            echo "code-signed: a certificate costs money and this project does not have"
            echo "one. Choose *More info* → *Run anyway*, or verify the download against"
            echo "the checksum below."
            echo
            echo "## SHA-256"
            echo
            echo '```'
            ( cd dist-app && sha256sum *.exe )
            echo '```'
          } > release-notes.md
          cat release-notes.md

      # `gh` is preinstalled on GitHub runners, so this needs no third-party
      # action — one less unvetted dependency in a repo that vendors its own.
      #
      # --notes-file, and NOT --generate-notes as well: gh's behaviour when both
      # are given is version-dependent, and a release whose body silently came
      # out different from what was written here is exactly the kind of surprise
      # a release should not contain.
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists — replacing its assets"
            gh release upload "$TAG" dist-app/*.exe --clobber
          else
            gh release create "$TAG" dist-app/*.exe \
              --title "WOLFSPACE $TAG" \
              --notes-file release-notes.md
          fi
          gh release view "$TAG" --json url,assets \
            --jq '.url, (.assets[] | "\(.name)  \(.size) bytes")'
