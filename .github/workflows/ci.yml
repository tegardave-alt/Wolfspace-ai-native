# CI WOLFSPACE — menangkap kelas bug yang MUSTAHIL ketahuan di mesin dev sendiri.
#
# Kenapa job-job ini, bukan sekadar "npm test": hook husky lokal sudah menjalankan
# lint + jest tiap commit, jadi menduplikasinya di CI hampir tak menambah nilai.
# Yang TIDAK pernah dijalankan lokal justru yang berbahaya — dan riwayat repo ini
# membuktikannya:
#   - build Electron tak pernah dicoba -> hanya 2 dari 39 file yg di-require ikut
#     terpaket; app terpasang membuka jendela tapi seluruh backend mati.
# Polanya: FITUR YANG TAK PERNAH DIEKSEKUSI = RUSAK DIAM-DIAM.
#
# Job build-docker DIHAPUS bersama berkas Docker-nya. Ia dulu menjaga
# sandbox/Dockerfile — yang pernah hilang ~5 minggu tanpa ketahuan karena tak
# ada yang punya Docker untuk mencobanya. Pengurungan sekarang memakai namespace
# Linux (agent/tools/bash-jail.cjs) dan zona WSL, tanpa daemon apa pun, dan
# keduanya diuji di suite biasa.
#
# Sengaja TANPA CD (tak ada rilis/publish). Tambahkan itu belakangan, dipicu tag,
# supaya commit eksperimental tidak menghabiskan menit build.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch: # bisa dijalankan manual dari tab Actions

# Push beruntun ke branch yang sama: batalkan run lama. Job Electron memakan
# menit build cukup besar, jadi jangan biarkan antrean menumpuk untuk commit
# yang sudah usang.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # husky adalah devDependency; script `prepare` gagal di lingkungan tanpa hook git.
  HUSKY: 0

jobs:
  test:
    name: Test & syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Jest
        run: npm test

  build-electron:
    name: Build Electron (windows)
    runs-on: windows-latest
    # Rebuild node-pty + paket ~29MB public/: lambat, tapi 30 menit sudah sangat
    # longgar. Batas ini mencegah job menggantung menghabiskan menit build.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      # Runner Windows GitHub sudah membawa Visual Studio Build Tools, jadi
      # node-pty (modul native) bisa di-rebuild di sini — sesuatu yang gagal di
      # mesin dev tanpa toolchain C++. Inilah alasan utama job ini ada.
      - run: npm ci

      # electron/main.js dan electron/preload.js DIBANGUN di sini, bukan di-commit.
      # electron-builder mengemas pohon berkas apa adanya, jadi tanpa langkah ini
      # paketnya berisi aplikasi tanpa main process dan tanpa jembatan preload —
      # buildnya sukses, dan rusaknya baru ketahuan saat dijalankan.
      - name: Bangun artefak Electron
        run: npm run build:preload && npm run build:main

      - name: Package (dir saja, tanpa installer)
        run: npx electron-builder --win --dir

      # INTI job ini. Membangun saja tidak cukup: bug lama menghasilkan build yang
      # "sukses" padahal isinya tidak lengkap. Jadi verifikasi eksplisit bahwa file
      # yang di-require RUNTIME benar-benar ada DAN rantai require-nya bisa
      # diselesaikan dari lokasi hasil paket (main.js memuat core dari
      # app.asar.unpacked, bukan dari asar).
      - name: Verifikasi isi paket
        shell: bash
        run: |
          set -e
          UNPACKED="dist-app/win-unpacked/resources/app.asar.unpacked"
          test -d "$UNPACKED" || { echo "::error::$UNPACKED tidak ada"; exit 1; }
          gagal=0
          # core/terminal.ts ada di daftar ini karena PERNAH hilang: build.files
          # menyebut "terminal.cjs" di akar — berkas yang tak pernah ada — sisa dari
          # masa berkas itu belum dipindah ke core/. Selama satu-satunya pemakainya
          # (agent/tools/exec-tools.cjs) membungkus require dalam try/catch, tool
          # terminal cuma mati diam-diam di aplikasi terpaket dan tak ada yang tahu.
          # Begitu server.cjs me-require-nya di tingkat atas, seluruh backend gagal
          # dimuat dan job ini merah.
          # scripts/ts-register.cjs and the .ts files under server/routes/ are on this
          # list because server.cjs requires them at top level since the gradual
          # TypeScript migration started. build.files previously named only
          # "scripts/ww.ts", so without the new entries the whole backend fails to
          # load in the packaged app — exactly the class of bug this job exists to catch.
          for f in core.js server.cjs server.ts core/terminal.ts scripts/ww.ts scripts/ts-register.cjs \
                   agent/self_agent.ts agent/mcp-client.ts \
                   agent/sandbox.ts agent/sandbox-policy.ts \
                   agent/broker/zone-worker.cjs agent/broker/zone-process.ts \
                   agent/broker/host.ts agent/broker/policy.ts \
                   agent/broker/audit-log.ts agent/broker/commandchain.ts \
                   server/routes/terminal.ts server/routes/debug.ts server/routes/snapshots.ts \
                   server/routes/cloud.ts server/routes/dap.ts; do
            if [ -f "$UNPACKED/$f" ]; then
              echo "  ok      $f"
            else
              echo "::error::hilang dari paket: $f"; gagal=1
            fi
          done
          [ "$gagal" = "0" ] || exit 1

          # electron/preload.js diperiksa TERPISAH karena ia ada DI DALAM
          # app.asar, bukan di app.asar.unpacked: electron/** memang tidak
          # ikut asarUnpack. Ia berkas hasil generate dari preload.ts dan yang
          # benar-benar dimuat Electron — kalau hilang, jendela terbuka tanpa
          # window.WOLFSPACE sama sekali dan renderer tak bisa menjangkau apa pun.
          echo "--- artefak generated di dalam asar ---"
          node -e "
            const asar = require('@electron/asar');
            const isi = asar.extractFile('dist-app/win-unpacked/resources/app.asar',
                                         'electron/preload.js').toString('utf8');
            if (!isi.includes('exposeInMainWorld(\"WOLFSPACE\"')) {
              console.error('::error::preload.js terpaket tapi tak memasang jembatan');
              process.exit(1);
            }
            console.log('  ok      electron/preload.js (' + isi.length + ' bytes)');
            const utama = asar.extractFile('dist-app/win-unpacked/resources/app.asar',
                                           'electron/main.js').toString('utf8');
            if (!utama.includes('GENERATED FILE') || !utama.includes('BrowserWindow')) {
              console.error('::error::main.js terpaket tapi bukan hasil build yang sah');
              process.exit(1);
            }
            console.log('  ok      electron/main.js (' + utama.length + ' bytes)');
          "

          echo "--- uji rantai require dari hasil paket ---"
          cd "$UNPACKED"
          node -e "
            const core = require('./core.js');
            if (!core || !core.server) { console.error('core.server tidak tersedia'); process.exit(1); }
            console.log('core.js OK, ekspor:', Object.keys(core).length);
          "
