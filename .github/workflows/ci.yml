# CI WOLFSPACE — menangkap kelas bug yang MUSTAHIL ketahuan di mesin dev sendiri.
#
# Kenapa job-job ini, bukan sekadar "npm test": hook husky lokal sudah menjalankan
# lint + jest tiap commit, jadi menduplikasinya di CI hampir tak menambah nilai.
# Yang TIDAK pernah dijalankan lokal justru yang berbahaya — dan riwayat repo ini
# membuktikannya:
#   - build Electron tak pernah dicoba -> hanya 2 dari 39 file yg di-require ikut
#     terpaket; app terpasang membuka jendela tapi seluruh backend mati.
# Polanya: FITUR YANG TAK PERNAH DIEKSEKUSI = RUSAK DIAM-DIAM.
#
# Job build-docker DIHAPUS bersama berkas Docker-nya. Ia dulu menjaga
# sandbox/Dockerfile — yang pernah hilang ~5 minggu tanpa ketahuan karena tak
# ada yang punya Docker untuk mencobanya. Pengurungan sekarang memakai namespace
# Linux (agent/tools/bash-jail.cjs) dan zona WSL, tanpa daemon apa pun, dan
# keduanya diuji di suite biasa.
#
# Sengaja TANPA CD (tak ada rilis/publish). Tambahkan itu belakangan, dipicu tag,
# supaya commit eksperimental tidak menghabiskan menit build.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch: # bisa dijalankan manual dari tab Actions

# Push beruntun ke branch yang sama: batalkan run lama. Job Electron memakan
# menit build cukup besar, jadi jangan biarkan antrean menumpuk untuk commit
# yang sudah usang.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # husky adalah devDependency; script `prepare` gagal di lingkungan tanpa hook git.
  HUSKY: 0

jobs:
  test:
    name: Test & syntax
    runs-on: ubuntu-latest
    # 20, DAN TEORI PERTAMA SAYA SOAL ANGKA INI SALAH.
    #
    # Batas 10 menit ditabrak sekali: langkah Jest DIBATALKAN pada 558 detik
    # dan job-nya berhenti di 10 menit 14 detik. Tak satu pun uji merah --
    # waktunya yang habis.
    #
    # Saya menyimpulkan suite-nya membengkak: lima berkas uji baru ditambahkan
    # hari itu, beberapa men-spawn proses sungguhan. Run BERIKUTNYA menggugurkan
    # itu -- Jest 147 detik, praktis sama dengan 141 detik pada run 247, dengan
    # kelima berkas itu sudah di dalamnya. Jadi pertumbuhannya nyaris nol dan
    # yang 558 detik itu runner yang tersendat, bukan pekerjaan yang bertambah.
    #
    # Batasnya tetap dinaikkan, tapi alasannya berbeda dari yang saya kira:
    # bukan menampung suite yang lebih berat, melainkan menyisakan margin
    # terhadap runner yang sesekali lambat 4x. Batas itu TIDAK dihapus -- ia
    # menjaga suite yang MENGGANTUNG agar tak menghabiskan menit build diam-diam.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # shell: bash memberi -o pipefail, tanpa itu kode keluar jest hilang
      # ditelan tee dan langkah ini akan HIJAU meski tesnya merah.
      # Browsernya diunduh TERPISAH dari modul npm. Tanpa langkah ini
      # tests/render-hidup dan tests/web-extract akan DILEWATI di CI — dan tes
      # yang tak pernah jalan tak membuktikan apa pun. Chromium saja, karena
      # itu yang dipakai agent/web.ts.
      # Renderer dibangun lebih dulu supaya tests/render-hidup memuat apa yang
      # PRODUKSI sajikan. Tanpa ini index.html jatuh ke jalur cadangan dan
      # mengompilasi 631 KB dengan Babel DI DALAM browser headless — terukur ~3
      # detik di mesin cepat, dan tesnya menunggu 5 detik sebelum memeriksa DOM.
      # Jadi tesnya bukan menguji aplikasi, melainkan kecepatan runner.
      - name: Bangun renderer
        run: npm run build:app

      # KENAPA typecheck ADA DI SINI SEKARANG.
      #
      # Ia tak pernah dijalankan CI, dan itu bukan kelalaian yang tak berakibat:
      # `typescript` ternyata TIDAK pernah tercatat di package.json sama sekali.
      # Ia bertahan hanya karena kebetulan tersisa di node_modules seseorang.
      # Begitu `npm ci` menghapus node_modules dan memasang ulang dari lock,
      # ia hilang — dan `npm run typecheck` berhenti bisa dijalankan tanpa satu
      # pun yang mengeluh, karena tak ada yang menjalankannya.
      #
      # Penjaga yang tak pernah dijalankan tak menjaga apa pun. Delapan project
      # tsc di skrip itu memeriksa yang TIDAK diperiksa Jest: kontrak tipe
      # lintas berkas, yang tak terlihat oleh uji berbasis teks maupun oleh
      # esbuild (esbuild hanya melucuti tipe, ia tak pernah memeriksanya).
      - name: Typecheck
        run: npm run typecheck

      # GAGAL DUA KALI, jadi bukan kedipan jaringan -- dan ulangan polos yang
      # dipasang sebelumnya justru yang membuktikannya. Itu memang gunanya.
      #
      # Riwayatnya: empat run sukses 22-25 detik dengan langkah yang sama persis,
      # lalu gagal 8 detik, lalu gagal lagi sesudah jeda 15 detik. Log GitHub
      # menjawab 403 untuk permintaan anonim, jadi sebabnya tak bisa dibaca
      # langsung; yang tersisa adalah bentuk kegagalannya.
      #
      # Bentuk itu cocok dengan kelas galat yang terdokumentasi di playwright:
      # `--with-deps` menjalankan apt-get, dan metadata repositori di runner bisa
      # basi -- "Repository ... changed its 'Label' value" mengembalikan exit 100
      # seketika. Gagal cepat, berulang, dan tak ada hubungannya dengan unduhan
      # browser. `playwright` sendiri sudah terdeklarasi dan ada di node_modules,
      # jadi ini juga bukan npx yang menarik paket dari registry.
      #
      # Dua lapis, dan urutannya disengaja:
      #   1. segarkan metadata apt dengan --allow-releaseinfo-change, yang persis
      #      menyasar sebab di atas. Dibuat TOLERAN (|| true): kalau ia sendiri
      #      gagal, itu bukan alasan menjatuhkan seluruh pemeriksaan.
      #   2. kalau --with-deps masih menolak, pasang browsernya SAJA. Runner
      #      ubuntu sudah membawa hampir semua pustaka yang dibutuhkan chromium,
      #      jadi ini biasanya cukup -- dan kalau ternyata tidak, uji browser yang
      #      merah akan mengatakannya dengan sebab yang benar, bukan seluruh suite
      #      yang dilewati dengan sebab yang tak terbaca.
      - name: Pasang browser Playwright
        run: |
          sudo apt-get update --allow-releaseinfo-change -y || true
          npx playwright install --with-deps chromium || npx playwright install chromium

      - name: Jest
        shell: bash
        run: npm test 2>&1 | tee /tmp/jest.log

      # Kegagalan hanya-CI harus bisa didiagnosis tanpa mengunduh log mentah:
      # log butuh autentikasi, anotasi tidak. Yang diangkat cuma nama suite yang
      # merah dan baris ringkasannya — cukup untuk tahu ke mana harus melihat.
      - name: Ringkas kegagalan Jest
        if: failure()
        shell: bash
        run: |
          # Nama suite saja ternyata tak cukup: ia memberi tahu MANA yang merah
          # tapi bukan KENAPA, dan tiap siklus CI mahal. Baris Expected/Received
          # ikut diangkat — itu yang membedakan "bisa diperbaiki" dari "harus
          # menebak lagi".
          grep -E '^(FAIL |  ● |Tests: |Test Suites: )|Expected|Received|Cannot find|not a function|ENOENT' /tmp/jest.log \
            | head -80 \
            | while IFS= read -r baris; do echo "::error::$baris"; done

  build-electron:
    name: Build Electron (windows)
    runs-on: windows-latest
    # 45, dan angka ini diukur bukan ditebak. Job ini KEHABISAN 30 menit setelah
    # Monaco di-vendor ulang (+34 MB, +120 berkas di public/) dan Electron naik
    # 33 -> 44. Diukur di mesin dev dengan biner Electron SUDAH ter-cache:
    # electron-builder --win --dir = 452 detik, keluaran 653 MB. Runner tidak
    # punya cache itu, jadi tambahkan unduhan Electron 44 di atasnya.
    #
    # Batasnya tetap ada supaya job yang MENGGANTUNG tidak menghabiskan menit
    # build; yang dinaikkan cuma marginnya.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      # KENAPA JOB INI ADA, dinyatakan ulang karena versi sebelumnya salah.
      #
      # Komentar lama berbunyi "node-pty bisa di-rebuild di sini ... inilah
      # alasan utama job ini ada". Itu tidak terjadi: package.json menyetel
      # build.npmRebuild = false, dan electron-builder mengatakannya sendiri di
      # log -- "skipped dependencies rebuild, reason=npmRebuild is set to
      # false". Rebuild-nya juga tak diperlukan: node-pty mengirim prebuild
      # N-API (prebuilds/win32-x64/pty.node), yang tidak terikat ABI Node
      # maupun Electron -- itulah sebabnya lompatan 33 -> 44 tidak merusaknya.
      #
      # Yang benar-benar dijaga job ini adalah ISI PAKET. electron-builder
      # mengemas pohon berkas apa adanya, jadi sebuah build bisa "sukses" sambil
      # berisi aplikasi tanpa main process. Langkah verifikasi di bawah yang
      # menangkap itu.
      - run: npm ci

      # Biner Electron TIDAK ikut cache npm.
      #
      # actions/setup-node dengan cache:npm hanya menyimpan paket npm. Electron
      # sendiri diunduh electron-builder ke cache terpisah, dan di runner cache
      # itu kosong setiap kali. Diukur di mesin dev: ~/AppData/Local/electron
      # 371 MB, ~/AppData/Local/electron-builder 35 MB -- keduanya diunduh ulang
      # dari nol pada tiap run tanpa langkah ini.
      - name: Cache biner Electron
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-

      # electron/main.js dan electron/preload.js DIBANGUN di sini, bukan di-commit.
      # electron-builder mengemas pohon berkas apa adanya, jadi tanpa langkah ini
      # paketnya berisi aplikasi tanpa main process dan tanpa jembatan preload —
      # buildnya sukses, dan rusaknya baru ketahuan saat dijalankan.
      - name: Bangun artefak Electron
        run: npm run build:preload && npm run build:main && npm run build:app

      # AcLaunch.exe is GITIGNORED: a clone has the C# source and no binary. It
      # is on the verification list below, so it has to exist before packaging.
      # csc.exe ships with the .NET Framework already on Windows, and the compile
      # takes under a second.
      - name: Bangun peluncur AppContainer
        run: npm run build:aclaunch

      # UJI SANDBOX DIJALANKAN DI SINI, DAN HANYA BISA DI SINI.
      #
      # Saya sempat menaruh langkah ini di job `test` dan menyebutnya "uji mesin
      # bersih". Itu SALAH: job `test` berjalan di ubuntu-latest, jadi seluruh
      # berkas uji AppContainer melewati dirinya sendiri di sana dan membangun
      # AcLaunch.exe pun tak ada gunanya. Klaimnya terdengar benar selama tak
      # ada yang memeriksa runner-nya.
      #
      # Job INI windows-latest, dan runner-nya VM baru tiap run: tanpa profil
      # AppContainer, tanpa seorang pun yang pernah menjalankan skrip penyiapan.
      # Itulah mesin yang dipersoalkan -- pengguna yang memasang installer dan
      # belum menyiapkan apa pun.
      #
      # Satu berkas saja, bukan seluruh suite: sisanya sudah dijalankan job
      # `test`, dan mengulangnya di sini membayar dua kali untuk jawaban sama.
      - name: Uji sandbox di mesin Windows yang bersih
        run: npx jest tests/appcontainer-profil-otomatis.test.ts

      # PENANDATANGANAN DIMATIKAN, dan flag-nya dipilih dengan mengukur.
      #
      # Tanpa ini electron-builder mencari sertifikat sendiri, mengunduh paket
      # winCodeSign supaya punya signtool.exe, lalu menjalankannya pada tiap
      # biner -- terhitung SEPULUH kali di build lokal (node-pty
      # winpty-agent/OpenConsole untuk x64 dan arm64, esbuild.exe, dan
      # seterusnya). Runner tidak punya sertifikat, jadi tak satu pun tanda
      # tangan itu berarti.
      #
      # CSC_IDENTITY_AUTO_DISCOVERY=false DICOBA LEBIH DULU DAN TIDAK CUKUP:
      # hitungan signtool tetap 10. Variabel itu mengatur pencarian SERTIFIKAT,
      # bukan langkah sign-and-edit-nya. Dengan flag di bawah hitungannya 0.
      #
      # Konsekuensinya diterima dengan sadar: signAndEditExecutable juga
      # mematikan penyuntingan ikon dan info versi pada exe. Yang dihasilkan job
      # ini adalah direktori yang DIPERIKSA ISINYA lalu dibuang -- tak pernah
      # jadi installer, tak pernah sampai ke siapa pun. Flag-nya ada DI SINI dan
      # bukan di package.json, jadi build rilis sungguhan tetap menandatangani
      # dan tetap berikon.
      #
      # Diverifikasi: build tanpa tanda tangan tetap LOLOS langkah verifikasi
      # isi paket di bawah, dan WOLFSPACE.exe tetap dihasilkan.
      - name: Package (dir saja, tanpa installer)
        run: npx electron-builder --win --dir --config.win.signAndEditExecutable=false

      # INTI job ini. Membangun saja tidak cukup: bug lama menghasilkan build yang
      # "sukses" padahal isinya tidak lengkap. Jadi verifikasi eksplisit bahwa file
      # yang di-require RUNTIME benar-benar ada DAN rantai require-nya bisa
      # diselesaikan dari lokasi hasil paket (main.js memuat core dari
      # app.asar.unpacked, bukan dari asar).
      - name: Verifikasi isi paket
        shell: bash
        run: |
          set -e
          UNPACKED="dist-app/win-unpacked/resources/app.asar.unpacked"
          test -d "$UNPACKED" || { echo "::error::$UNPACKED tidak ada"; exit 1; }
          gagal=0
          # core/terminal.ts ada di daftar ini karena PERNAH hilang: build.files
          # menyebut "terminal.cjs" di akar — berkas yang tak pernah ada — sisa dari
          # masa berkas itu belum dipindah ke core/. Selama satu-satunya pemakainya
          # (agent/tools/exec-tools.cjs) membungkus require dalam try/catch, tool
          # terminal cuma mati diam-diam di aplikasi terpaket dan tak ada yang tahu.
          # Begitu server.cjs me-require-nya di tingkat atas, seluruh backend gagal
          # dimuat dan job ini merah.
          # scripts/ts-register.cjs and the .ts files under server/routes/ are on this
          # list because server.cjs requires them at top level since the gradual
          # TypeScript migration started. build.files previously named only
          # "scripts/ww.ts", so without the new entries the whole backend fails to
          # load in the packaged app — exactly the class of bug this job exists to catch.
          for f in core.js server.cjs server.ts core/terminal.ts scripts/ww.ts scripts/ts-register.cjs \
                   agent/self_agent.ts agent/mcp-client.ts \
                   agent/sandbox.ts agent/sandbox-policy.ts \
                   agent/broker/zone-worker.cjs agent/broker/zone-process.ts \
                   agent/broker/host.ts agent/broker/policy.ts \
                   agent/broker/audit-log.ts agent/broker/commandchain.ts \
                   server/routes/terminal.ts server/routes/debug.ts server/routes/snapshots.ts \
                   server/routes/cloud.ts server/routes/dap.ts                    scripts/appcontainer/AcLaunch.exe; do
            if [ -f "$UNPACKED/$f" ]; then
              echo "  ok      $f"
            else
              echo "::error::hilang dari paket: $f"; gagal=1
            fi
          done
          [ "$gagal" = "0" ] || exit 1

          # electron/preload.js diperiksa TERPISAH karena ia ada DI DALAM
          # app.asar, bukan di app.asar.unpacked: electron/** memang tidak
          # ikut asarUnpack. Ia berkas hasil generate dari preload.ts dan yang
          # benar-benar dimuat Electron — kalau hilang, jendela terbuka tanpa
          # window.WOLFSPACE sama sekali dan renderer tak bisa menjangkau apa pun.
          echo "--- artefak generated di dalam asar ---"
          node -e "
            const asar = require('@electron/asar');
            const isi = asar.extractFile('dist-app/win-unpacked/resources/app.asar',
                                         'electron/preload.js').toString('utf8');
            if (!isi.includes('exposeInMainWorld(\"WOLFSPACE\"')) {
              console.error('::error::preload.js terpaket tapi tak memasang jembatan');
              process.exit(1);
            }
            console.log('  ok      electron/preload.js (' + isi.length + ' bytes)');
            const utama = asar.extractFile('dist-app/win-unpacked/resources/app.asar',
                                           'electron/main.js').toString('utf8');
            if (!utama.includes('GENERATED FILE') || !utama.includes('BrowserWindow')) {
              console.error('::error::main.js terpaket tapi bukan hasil build yang sah');
              process.exit(1);
            }
            console.log('  ok      electron/main.js (' + utama.length + ' bytes)');
          "

          echo "--- uji rantai require dari hasil paket ---"
          cd "$UNPACKED"
          # core.js SAJA tidak cukup, dan itu terbukti mahal. Pemeriksaan ini
          # sudah ada saat installer v0.1.0 dirilis TANPA satu pun dependensi
          # produksi, dan ia tetap hijau: core.js -> server.cjs -> server.ts
          # tidak pernah menyentuh @langchain/langgraph, yang di-require
          # self_agent. Aplikasi terpasang mati dengan "Cannot find module".
          #
          # Jadi rantainya ditarik sampai ke modul yang benar-benar memakai
          # dependensi pihak ketiga. require() nyata, bukan test-keberadaan
          # berkas: yang gagal di mesin pengguna adalah RESOLUSI, dan sebuah
          # berkas yang ada di dalam app.asar tak bisa diresolusi dari
          # app.asar.unpacked.
          node -e "
            const core = require('./core.js');
            if (!core || !core.server) { console.error('::error::core.server tidak tersedia'); process.exit(1); }
            console.log('  ok      core.js (ekspor: ' + Object.keys(core).length + ')');
            const sa = require('./agent/self_agent.ts');
            if (typeof sa.selfAgentStream !== 'function') {
              console.error('::error::self_agent terpaket tapi selfAgentStream hilang');
              process.exit(1);
            }
            console.log('  ok      agent/self_agent.ts (+ dependensinya)');
            // KELUAR EKSPLISIT, dan ini bukan kerapian melainkan syarat.
            //
            // Langkah ini MEMBUKTIKAN rantai require bisa diselesaikan dari
            // lokasi hasil paket. Tapi me-require server.ts BUKAN pemeriksaan
            // murah: ia memanggil startJedi() di tingkat modul (server.ts),
            // yang mencari Python lalu men-spawn jedi_worker.py sebagai proses
            // persisten dengan stdio berpipa. Handle-nya terukur --
            // { ChildProcess: 1, Socket: 3 } -- dan node tak akan pernah keluar
            // selama itu hidup.
            //
            // Untuk SERVER itu benar: ia memang proses panjang umur. Untuk
            // pemeriksaan ini tidak: skripnya selesai dalam 267 ms lalu
            // menggantung sampai batas job. Terukur di CI: langkah ini memakan
            // 2634 detik (44 menit) dan dibatalkan, sementara packaging-nya
            // sendiri cuma 37 detik.
            //
            // Semua kegagalan di atas sudah exit(1) lebih dulu, jadi exit(0) di
            // sini hanya menutup proses yang pekerjaannya memang sudah selesai.
            process.exit(0);
          "

      # KREDENSIAL TIDAK BOLEH ADA DI DALAM PAKET.
      #
      # server/cloud-keys.json berisi kunci API sungguhan dan BENAR di-gitignore.
      # Tapi electron-builder tidak membaca .gitignore — ia memakai build.files,
      # yang memuat "server/**" — jadi kuncinya ikut ke installer v0.1.0, v0.1.1
      # dan v0.1.2, ketiganya terbit publik.
      #
      # Dua sistem pengecualian yang tak saling bicara. Yang satu melindungi repo,
      # yang lain menyusun paket, dan berkas yang aman di mata yang pertama tetap
      # dikirim oleh yang kedua.
      #
      # Memindai HASILNYA, bukan konfigurasinya: pola tolak yang salah ketik akan
      # lolos uji konfigurasi dan tetap mengirim kuncinya. Di dalam asar ikut
      # diperiksa — sebuah berkas tak perlu ter-unpack untuk bisa dibaca orang.
      - name: Tak ada kredensial di dalam paket
        shell: bash
        run: |
          set -e
          POLA='cloud-keys\.json$|\.pem$|\.key$|(^|/)\.env($|\.)|(^|/)\.wolfspace/'
          gagal=0
          echo "--- app.asar.unpacked ---"
          if find dist-app/win-unpacked/resources/app.asar.unpacked -type f 2>/dev/null                | grep -nE "$POLA"; then
            echo "::error::berkas kredensial ada di app.asar.unpacked"; gagal=1
          fi
          echo "--- di dalam app.asar ---"
          node -e "
            const asar = require('@electron/asar');
            const re = /cloud-keys\.json\$|\.pem\$|\.key\$|(^|\/)\.env(\$|\.)|(^|\/)\.wolfspace\//;
            const isi = asar.listPackage('dist-app/win-unpacked/resources/app.asar');
            const buruk = isi.filter((f) => re.test(f));
            if (buruk.length) {
              for (const f of buruk) console.error('::error::kredensial di dalam asar: ' + f);
              process.exit(1);
            }
            console.log('  ok      tak ada kredensial di dalam asar (' + isi.length + ' entri diperiksa)');
          "
          [ "$gagal" = "0" ] || exit 1
          echo "  ok      paket bersih dari kredensial"
