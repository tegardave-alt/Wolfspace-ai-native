<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quantum</title>
  <script>
    // Zero-HTTP: route ALL relative API calls through Electron IPC. Non-streaming
    // → invoke('api'); SSE-progress downloads → stream('api') backed by a
    // ReadableStream so res.body.getReader() still works. No HTTP server exists.
    (function(){
      var q = window.quantum;
      if (!(q && q.ipc)) return;                       // plain browser: keep native fetch
      var STREAM = /\/(hf|ollama)\/download/;          // endpoints that stream SSE progress
      var _f = window.fetch.bind(window);
      window.fetch = function(u, o){
        o = o || {};
        if (typeof u === 'string' && u.charAt(0) === '/') {
          if (STREAM.test(u)) {
            var enc = new TextEncoder(), cancelFn;
            var rs = new ReadableStream({
              start: function(ctrl){ cancelFn = q.stream('api',
                { method: (o.method||'GET'), path: u, body: (o.body!=null ? (''+o.body) : null) },
                function(chunk){ try { ctrl.enqueue(enc.encode(chunk)); } catch(e){} },
                function(){ try { ctrl.close(); } catch(e){} }); },
              cancel: function(){ if (cancelFn) cancelFn(); }
            });
            if (o.signal) o.signal.addEventListener('abort', function(){ if (cancelFn) cancelFn(); });
            return Promise.resolve(new Response(rs, { status: 200, headers: { 'content-type': 'text/event-stream' } }));
          }
          return q.invoke('api', { method: (o.method||'GET'), path: u, body: (o.body!=null ? (''+o.body) : null) })
            .then(function(r){ return new Response(r.body, { status: r.status||200, headers: r.headers||{} }); });
        }
        return _f(u, o);
      };
    })();
  </script>
  <link rel="icon" href="/icon.png" />
  <link rel="stylesheet" href="/vendor/fonts.css" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="root"></div>
  <!-- React + Babel bundled locally for full offline use -->
  <script src="/vendor/react.production.min.js"></script>
  <script src="/vendor/react-dom.production.min.js"></script>
  <script src="/vendor/babel.min.js"></script>
  <!-- Monaco (VS Code editor) — bundled locally, real highlighting + autocomplete -->
  <script src="/vendor/monaco/vs/loader.js"></script>
  <script>
    // Load Monaco from the SAME origin (app:// from disk). The old HTTP server is gone,
    // so it must come from the protocol — otherwise the editor never loads (blank code).
    var MB = location.origin;
    window.MonacoEnvironment = { getWorkerUrl: function(moduleId, label) {
      // Return direct URLs to worker files — avoids fragile Blob-importScripts chain
      var d = MB + '/vendor/monaco/vs';
      if (label === 'json') return d + '/language/json/jsonWorker.js';
      if (label === 'css' || label === 'scss' || label === 'less') return d + '/language/css/cssWorker.js';
      if (label === 'html' || label === 'handlebars' || label === 'razor') return d + '/language/html/htmlWorker.js';
      if (label === 'typescript' || label === 'javascript') return d + '/language/typescript/tsWorker.js';
      return d + '/base/worker/workerMain.js';
    } };
    require.config({ paths: { vs: MB + '/vendor/monaco/vs' } });
    window.monacoReady = new Promise(function(res){ require(['vs/editor/editor.main'], function(){ res(window.monaco); }); });
  </script>
  <script type="text/babel" src="/app.jsx"></script>
</body>
</html>
