name: quantum_studio
description: Quantum Web Dev studio (embedded Flutter module)
publish_to: none
version: 1.0.0
environment:
  sdk: ">=3.0.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  # Typography & Text
  google_fonts: ^6.1.0
  auto_size_text: ^3.0.0
  # Animations
  flutter_animate: ^4.5.0
  flutter_staggered_animations: ^1.1.1
  # Visual Effects
  shimmer: ^3.0.0
  # Indicators & Charts
  percent_indicator: ^4.2.3
  fl_chart: ^0.68.0
  # Icons & Media
  flutter_svg: ^2.0.10
  cached_network_image: ^3.3.1
  # Layout
  flutter_staggered_grid_view: ^0.7.0
  # Loading
  flutter_spinkit: ^5.2.1

flutter:
  uses-material-design: true
